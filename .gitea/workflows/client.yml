name: Client CI
run-name: ${{ github.actor }} is checking the React Native client

on:
  push:
    paths:
      - "client/**"
      - ".gitea/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".gitea/workflows/client.yml"
  workflow_dispatch:
  schedule:
    # Daily 20:30 UTC (~04:30 北京时间) nightly build
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          set -eux
          cd client
          npm ci --no-audit --no-fund

      - name: Typecheck
        run: |
          set -eux
          cd client
          npx tsc --noEmit

      - name: Unit tests
        run: |
          set -eux
          cd client
          npm test -- --runInBand --ci

      # The client still carries a pre-existing lint baseline (unused symbols and
      # react-hooks/exhaustive-deps). Keep it visible but non-blocking until the
      # baseline is cleaned up, then remove continue-on-error.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          set -eux
          cd client
          npm run lint

  android-release:
    name: Android release APK
    # 单 runner 无法承受每次 push 都跑一次冷缓存 Gradle 构建：push/PR 只跑
    # quality，APK 构建保留给 schedule 与 workflow_dispatch。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          set -eux
          cd client
          npm ci --no-audit --no-fund

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ runner.os }}-12266719-platforms-37.0-build-37.0.0-ndk-27.1.12297006-cmake-3.22.1

      - name: Set up Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          marker="$ANDROID_HOME/.gitea-packages-ready"

          if [ ! -x "$sdk_manager" ]; then
            if ! command -v unzip >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends unzip
              else
                apt-get update
                apt-get install -y --no-install-recommends unzip
              fi
            fi
            mkdir -p "$ANDROID_HOME/cmdline-tools-tmp"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              --output "$ANDROID_HOME/commandline-tools.zip"
            unzip -q "$ANDROID_HOME/commandline-tools.zip" -d "$ANDROID_HOME/cmdline-tools-tmp"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools-tmp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$ANDROID_HOME/cmdline-tools-tmp" "$ANDROID_HOME/commandline-tools.zip"
          fi

          if [ ! -f "$marker" ]; then
            # `yes` gets SIGPIPE after sdkmanager consumes the last prompt. Keep
            # pipefail off for this pipeline only so the producer's expected 141
            # does not hide a real sdkmanager failure from the following check.
            license_status=0
            set +o pipefail
            yes | "$sdk_manager" --licenses >/dev/null || license_status=$?
            set -o pipefail
            if [ "$license_status" -ne 0 ]; then
              echo "::error::sdkmanager failed while accepting Android SDK licenses"
              exit "$license_status"
            fi
            "$sdk_manager" --install \
              "platform-tools" \
              "platforms;android-37.0" \
              "build-tools;37.0.0" \
              "ndk;27.1.12297006" \
              "cmake;3.22.1"
            touch "$marker"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/android/**/*.gradle*', 'client/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true"
        run: |
          set -eux
          cd client/android
          chmod +x gradlew
          # 与 nightly 相同的 versionCode 递进策略（yymmddnn），保证可覆盖安装。
          code="$(( $(date -u +%y%m%d) * 100 + 3 ))"
          echo "$code" > version-code.txt
          echo "push release versionCode=$code"
          ./gradlew assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.internal.http.socketTimeout=180000 \
            -Dorg.gradle.internal.http.connectionTimeout=60000

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: client-android-release
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish to nightly release
        # 仅定时/手动发布；push/PR 已不再构建 APK（android-release job 已门控）。
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          password: ${{ secrets.TOKEN }}
        run: |
          set -eux
          apk="client/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          api="${SERVER_URL%/}/api/v1/repos/${REPOSITORY}"
          auth="Authorization: token $password"

          release_json=$(curl -sf -H "$auth" "$api/releases/tags/nightly" || true)
          if [ -z "$release_json" ]; then
            release_json=$(curl -sf -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"nightly\",\"name\":\"Nightly\",\"body\":\"Android nightly build (app-release.apk). Install over a previous nightly build; signing key is stable.\",\"draft\":false,\"prerelease\":true}" \
              "$api/releases")
          fi
          release_id=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json" \
            -d "{\"body\":\"Android nightly build for commit ${GITHUB_SHA::7}. Install over a previous nightly build; signing key is stable.\"}" \
            "$api/releases/$release_id" >/dev/null
          asset_id=$(printf '%s' "$release_json" | python3 -c '
            import json,sys
            data = json.load(sys.stdin)
            for a in data.get("assets", []):
                if a["name"] == "lanlu-client-nightly.apk":
                    print(a["id"])
                    break
          ' || true)
          if [ -n "$asset_id" ]; then
            curl -sf -X DELETE -H "$auth" "$api/releases/$release_id/assets/$asset_id" >/dev/null
          fi
          curl -sf -X POST -H "$auth" \
            -F "attachment=@$apk" \
            "$api/releases/$release_id/assets?name=lanlu-client-nightly.apk" >/dev/null
          echo "Published lanlu-client-nightly.apk to nightly release (commit ${GITHUB_SHA::7})"
