      - name: Pre-generate FFI bridges
        # 三个 [ffi.c] 包在依赖解析阶段就校验静态库存在（产物被 gitignore），
        # 早于各包 build.cj 的 pre-build 钩子；fresh checkout 必须先按 build.cj 的
        # 同款命令各生成一次。rocksdb 用 C++ 头，其余两个是 C11。
        run: |
          set -eux
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          cc -std=c11 -Wall -Wextra -Werror -O2 -fPIC \
            -c packages/libavformat_ffi/native/lanlu_avformat_bridge.c \
            -o packages/libavformat_ffi/native/lanlu_avformat_bridge.o
          ar rcs packages/libavformat_ffi/native/liblanlu_avformat_bridge.a \
            packages/libavformat_ffi/native/lanlu_avformat_bridge.o
          # 桥里 #include <ft2build.h>，Ubuntu 把它放在 /usr/include/freetype2；
          # 路径随发行版/pkg-config 前缀变化，取 pkg-config 的 cflags 而不是硬编码。
          cc -std=c11 -Wall -Wextra -Werror -O2 -fPIC $(pkg-config --cflags freetype2) \
            -c packages/libass_ffi/native/lanlu_ass_bridge.c \
            -o packages/libass_ffi/native/lanlu_ass_bridge.o
          ar rcs packages/libass_ffi/native/liblanlu_ass_bridge.a \
            packages/libass_ffi/native/lanlu_ass_bridge.o

      - name: Build client-next
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          cd apps/desktop
          cjpm build -V

      - name: Diagnose test environment
        # run 1509 的 `cjpm test` 48 分钟零输出后被 job 超时强杀。两种可能：进程在
        # 启动前挂住，或只是编译阶段没有进度输出（不带 -V 时 cjpm 编译完全静默）。
        # 这里把环境事实打进日志，便于事后区分。
        run: |
          set -ux
          nproc || true
          free -m || true
          ulimit -a || true
          df -h /tmp || true

      - name: Compile client-next tests
        # 编译与执行拆成两步：`--no-run` 只编译并带 -V 打出每条 cjc 命令。
        # 若挂起，日志会停在最后一条编译命令上，而不是整段空白。
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          cd apps/desktop
          timeout 1800 cjpm test --no-run -V --no-color --parallel 1

      - name: Run client-next tests
        # --skip-build 复用上一步产物；--no-capture-output 让用例输出立即落日志，
        # 不再缓冲到结束（这是 run 1509 无法定位的直接原因）；--parallel 1 先排除
        # 并发因素，定位后再恢复 nCores。
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          cd apps/desktop
          mkdir -p target/test-results
          set +e
          timeout 900 cjpm test --skip-build --parallel 1 --no-color --no-capture-output \
            --timeout-each 60s --show-all-output \
            --report-path target/test-results --report-format xml
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "::error::cjpm test 被 900s 看门狗终止（单个用例 60s 超时未生效，说明卡在建用例之外）"
          fi
          exit "$rc"

      - name: Upload client-next test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: client-next-test-results
          path: apps/desktop/target/test-results/
          if-no-files-found: warn

  guards:
    # 静态门禁在 Gitea 侧始终运行：Gitea 是唯一实际验收通道，而 .github 的
    # guards job 受镜像阻塞。本 job 覆盖 .github/workflows/client-next.yml 的 guards
    # 中**不需要仓颉工具链**的部分：静态扫描（deps/platform/layering/SDL/文件桥/docs）
    # + LWP 生成物与 ABI + 壳侧 selftest + lwp/test.sh（仓颉侧自动跳过）+ 导出符号 ↔ liblwp.map 一致性。
    # 全部在仓库根执行（这些脚本依赖 CWD=根或自行 cd 到脚本上级）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository code
        env:
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CLONE_SHA: ${{ github.sha }}
          CLONE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 不用 actions/checkout：该 action 每次运行都要从 github.com 拉取 action 本体，
          # runner 出口网络抖动时会在 job 初始化阶段整体失败（run 1502 server-test：
          # "could not fetch remote 'origin': Recv failure: Connection reset by peer"）。
          # 这里改为直接向本实例 fetch。为了不引入语义变化，一次拉全部分支、tags 与
          # PR head：比 actions/checkout 默认的 depth=1 更宽，affected/守卫的 git 依赖不受影响。
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-$PWD}"
          # 复用工作目录时 .git 可能损坏（上一轮被中断），用 rev-parse 探测而不是只看目录存在。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            rm -rf .git
            git init -q
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$CLONE_URL"
          else
            git remote add origin "$CLONE_URL"
          fi
          # 自托管 runner 复用工作目录时，上一轮的未跟踪文件会挡住 checkout。
          git clean -ffdxq
          # 认证用环境变量而不是 `git -c http.extraheader=...`：后者会把 token 写进
          # 进程 argv，同机任意用户 `ps` 可见。GIT_CONFIG_* 只进进程 environ，作用域
          # 限于本 step 的 shell（函数内前置赋值，不 export，不影响后续步骤）。
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: token ${CLONE_TOKEN}" git "$@"
          }
          if ! git_auth fetch -q --prune --force origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              '+refs/pull/*/head:refs/remotes/pull/*'; then
            echo "fetch 失败：$CLONE_URL（检查 github.token 是否对该仓库有读权限）" >&2
            exit 1
          fi
          # actions/checkout 默认 depth=1，复用旧工作区时仓库可能是 shallow 的；
          # 补齐历史，避免依赖 git 历史的步骤（affected、计数类守卫）静默失真。
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git_auth fetch -q --unshallow --tags origin || {
              echo "解除 shallow 失败：$CLONE_URL" >&2; exit 1; }
          fi
          # pull_request 事件的 github.sha 可能是服务端生成的合并提交，不在 heads/tags/pull
          # 任何一个 ref 上；此时按 SHA 直接取（Forgejo 支持按 SHA fetch，本机已实测）。
          if ! git rev-parse --verify -q "${CLONE_SHA}^{commit}" >/dev/null; then
            git_auth fetch -q --force origin "$CLONE_SHA"
          fi
          git checkout -q --force "$CLONE_SHA"
          echo "checked out $(git rev-parse HEAD) ($(git rev-list --count HEAD) commits)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: xtask doctor
        run: python3 -m tools.xtask doctor --json

      - name: xtask self-tests
        run: python3 -m unittest discover -s tools/xtask/tests -t .

      - name: Dependency whitelist
        run: python3 tools/check-deps.py

      - name: Platform isolation
        run: python3 tools/check-platform-isolation.py

      # LWP 生成物必须与 IDL 一致（生成物入库，CI 校验无 diff）
      - name: LWP generated artifacts are up to date
        run: python3 tools/lwp-gen.py --check

      # 协议只允许追加：删字段/改类型必须 protocol_major + 1
      - name: LWP ABI is backward compatible
        run: python3 tools/lwp-gen.py --check-abi

      # 壳侧 LWP 发送端的字节级契约（协议模式 + 回落模式），纯 host cc，无需仓颉
      - name: Platform package selftest (shell LWP client)
        run: bash packages/lplatform-ohos/selftest/run-tests.sh

      # C 侧测试必跑；仓颉侧在没有 host 工具链时由脚本自行 [skip]，不会误报绿
      - name: LWP tests (C side + generated artifacts)
        run: bash packages/lwp/test.sh

      # 壳/引擎都依赖 liblwp_native.so；实际导出必须与 liblwp.map 声明的公开 API 完全一致
      # （计划 §5.2）。期望值直接取自 map 而不是再抄一份清单：抄的那份已经漂移过
      # （GitHub client-next.yml 的白名单缺 lwp_stats_summary / lwp_trace_replay）。
      - name: liblwp_native.so exports exactly the declared API
        run: |
          set -euo pipefail
          bash packages/lwp/native/build.sh
          got=$(nm -D --defined-only packages/lwp/lib/liblwp_native.so | awk '{print $3}' | sort | tr '\n' ' ')
          want=$(sed -n '/global:/,/local:/p' packages/lwp/native/liblwp.map | grep -o 'lwp_[a-z_]*' | sort | tr '\n' ' ')
          [ -n "$want" ] || { echo "liblwp.map 未解析出任何导出符号"; exit 1; }
          if [ "$got" != "$want" ]; then
            echo "导出符号与 liblwp.map 不符："; echo "  实际: $got"; echo "  声明: $want"; exit 1
          fi
          echo "[PASS] liblwp_native.so 导出符号与 liblwp.map 一致（$(echo "$want" | wc -w) 个）"

      - name: Layering / SDL / docs guards
        run: |
          set -eux
          bash tools/check-layering.sh
          bash tools/check-no-sdl.sh
          bash tools/check-no-file-bridge.sh
          python3 tools/check-docs-consistency.py
