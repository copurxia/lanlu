name: Build
run-name: ${{ github.actor }} is trying to auto compile with Actions 🚀
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # xmake refuses to run as root unless explicitly allowed. Some CI runners execute as root.
      XMAKE_ROOT: 'y'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true
      # - name: Setup Cangjie
      #   uses: Zxilly/setup-cangjie@v2
      #   with:
      #   channel: lts
      #   version: auto
      - name: Install build tools
        run: |
          set -eux

          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev libsqlite3-dev libmysqlclient-dev
          else
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev libsqlite3-dev libmysqlclient-dev
          fi

      - name: Verify xmake
        run: |
          set -eux
          xmake --version
      - name: Unzip Cangjie
        run: |
          wget -O c.tar.gz "${{ vars.CANGJIE_URL }}"
          tar -xzvf c.tar.gz
          wget -O s.zip "${{ vars.STDX_URL }}"
          unzip s.zip -d stdx
      - name: Checkout WasmEdge source (public)
        # 不用 actions/checkout 拉：默认向本实例查询 wasmedge 用户，
        # 报 "user redirect does not exist [name: wasmedge]"（run 985/993）。
        # 公开仓库直接 clone；不带 --depth 等价 fetch-depth: 0（全历史+tags）。
        run: |
          set -eux
          mkdir -p build-script-cache
          git clone https://github.com/WasmEdge/WasmEdge build-script-cache/WasmEdge
      - name: Set Up Cangjie and build
        run: |
          export CANGJIE_STDX_PATH="$PWD/stdx/linux_x86_64_cjnative/static/stdx"
          export WASMEDGE_REPO_DIR="$PWD/build-script-cache/WasmEdge"
          unset GIT_DIR GIT_WORK_TREE
          # ln -s "$PWD/stdx/linux_x86_64_cjnative" "$PWD/stdx/linux_x86_64_llvm"
          source cangjie/envsetup.sh
          # rocksdb_ffi 的 [ffi.c] 校验发生在 cjpm update 阶段，早于 build.cj 的
          # pre-build 钩子；fresh checkout 下 liblanlu_rocksdb_bridge.a 被 gitignore
          # 不存在，update 直接报 "can not find the library"。这里按 build.cj 的
          # 同款命令预生成（build 阶段 pre-build 会幂等重编，无冲突）。
          # （对齐 .github/workflows/build.yml 的既有 workaround，run 1001 实测缺它必挂）
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          cjpm update
          for f in $(find "$HOME/.cjpm/git/wasmedge_ffi" -type f -name build_native.sh 2>/dev/null); do
            grep -q "^unset GIT_DIR GIT_WORK_TREE$" "$f" || sed -i "2iunset GIT_DIR GIT_WORK_TREE" "$f"
            # Newer runner GCC flags vendored wasm.hh strncpy as -Wstringop-truncation.
            # WasmEdge appends its own -Werror after CMAKE_CXX_FLAGS, which overrides
            # the blanket -Wno-error in the script default; only a warning-specific
            # -Wno-error=... survives, so append one to the CXX flags default.
            grep -q -- "-Wno-error=stringop-truncation" "$f" || sed -i "s/-Wno-array-bounds/-Wno-array-bounds -Wno-error=stringop-truncation/" "$f"
          done
          cjc -v
          cjpm build -V
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Setup pnpm (corepack)
        run: |
          set -eux
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm -v
      - name: Build frontend
        run: |
          cd frontend
          pnpm install
          pnpm run build
      - name: Prepare release artifacts
        run: |
          mkdir -p app
          mkdir -p app/frontend
          cp target/release/bin/main app/
          cp -r frontend/out app/frontend/out
      - name: Archive production artifacts
        # v4 的 @actions/artifact 2.x 走 GitHub Artifact v2 协议，Forgejo 未实现，
        # 报 GHESNotSupportedError（run #1264）；v3 旧协议 Forgejo 兼容。
        uses: actions/upload-artifact@v3
        with:
          name: release
          path: |
            app/main
            app/frontend
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: release
          path: ./app/
      - name: Set execute permissions
        run: chmod +x ./app/main
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildkitd 跑在 dind 内的独立容器里，不读 dockerd 的 registry 加速配置；
          # 国内直连 registry-1.docker.io 被拒（run 1680：FROM ubuntu:26.04 处
          #   dial tcp 108.160.162.104:443: connect: connection refused），
          # 所以在这里直接把 docker.io 的 mirror 交给 buildkitd。
          # 官方输入：docker/setup-buildx-action 的 buildkitd-config-inline
          # （action.yml: "Inline BuildKit daemon config"）。
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["docker.1ms.run"]
      - name: Resolve image metadata
        id: image_meta
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          registry="${SERVER_URL#https://}"
          registry="${registry#http://}"
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY##*/}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tag="latest"
          else
            tag="dev-$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g')"
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$owner/$repo:${tag}" >> "$GITHUB_OUTPUT"
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image_meta.outputs.registry }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.image }}

  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools curl
          # runner 镜像不带 Rust 工具链，rustup/cargo 均需自装（run 983/986 教训）
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-musl

      - name: Build lanlu-mcp (static musl)
        run: |
          # PATH 不跨 step 持久，cargo 前必须再 source 一次
          . "$HOME/.cargo/env"
          cd mcp
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --target x86_64-unknown-linux-musl

      - name: Package lanlu-mcp zip
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist/lanlu-mcp
          cp mcp/target/x86_64-unknown-linux-musl/release/lanlu-mcp dist/lanlu-mcp/
          cp mcp/README.md dist/lanlu-mcp/
          chmod +x dist/lanlu-mcp/lanlu-mcp
          cd dist
          zip -qr "lanlu-mcp-${GITHUB_SHA::7}.zip" lanlu-mcp
          ls -lah .

      - name: Upload lanlu-mcp artifact
        uses: actions/upload-artifact@v3
        with:
          name: lanlu-mcp
          path: dist/lanlu-mcp-*.zip
