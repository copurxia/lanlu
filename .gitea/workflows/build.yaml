name: Build
run-name: ${{ github.actor }} is trying to auto compile with Actions 🚀
on: [push]
jobs:
  orm-test:
    # ORM 三包（csorm / csorm_macros / postgresql-driver）cjpm test。
    # 依赖真实 PostgreSQL：service 容器 + pg_trgm/unaccent 扩展 + bench_rows 种子。
    # 独立于主 build job（无需 vips/rocksdb 等重依赖），失败快速可见。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pgtest
          POSTGRES_DB: lanlutest
          # trust 认证（本地 CI 测试库，无敏感数据）；如需密码改这里与 DB_STRING 两处
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_STRING: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable&pool.max=5
      # psql(libpq) CLI 不认驱动特有的 pool.* 查询参数（invalid URI query parameter），
      # psql 仅用于建扩展/建表/种子；去掉 pool.* 指向同一数据库即可。
      PG_DSN: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable
    steps:
      - name: Check out repository code
        env:
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CLONE_SHA: ${{ github.sha }}
          CLONE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 不用 actions/checkout：该 action 每次运行都要从 github.com 拉取 action 本体，
          # runner 出口网络抖动时会在 job 初始化阶段整体失败（run 1502 server-test：
          # "could not fetch remote 'origin': Recv failure: Connection reset by peer"）。
          # 这里改为直接向本实例 fetch。为了不引入语义变化，一次拉全部分支、tags 与
          # PR head：比 actions/checkout 默认的 depth=1 更宽，affected/守卫的 git 依赖不受影响。
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-$PWD}"
          # 复用工作目录时 .git 可能损坏（上一轮被中断），用 rev-parse 探测而不是只看目录存在。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            rm -rf .git
            git init -q
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$CLONE_URL"
          else
            git remote add origin "$CLONE_URL"
          fi
          # 自托管 runner 复用工作目录时，上一轮的未跟踪文件会挡住 checkout。
          git clean -ffdxq
          # 认证用环境变量而不是 `git -c http.extraheader=...`：后者会把 token 写进
          # 进程 argv，同机任意用户 `ps` 可见。GIT_CONFIG_* 只进进程 environ，作用域
          # 限于本 step 的 shell（函数内前置赋值，不 export，不影响后续步骤）。
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: token ${CLONE_TOKEN}" git "$@"
          }
          if ! git_auth fetch -q --prune --force origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              '+refs/pull/*/head:refs/remotes/pull/*'; then
            echo "fetch 失败：$CLONE_URL（检查 github.token 是否对该仓库有读权限）" >&2
            exit 1
          fi
          # actions/checkout 默认 depth=1，复用旧工作区时仓库可能是 shallow 的；
          # 补齐历史，避免依赖 git 历史的步骤（affected、计数类守卫）静默失真。
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git_auth fetch -q --unshallow --tags origin || {
              echo "解除 shallow 失败：$CLONE_URL" >&2; exit 1; }
          fi
          # pull_request 事件的 github.sha 可能是服务端生成的合并提交，不在 heads/tags/pull
          # 任何一个 ref 上；此时按 SHA 直接取（Forgejo 支持按 SHA fetch，本机已实测）。
          if ! git rev-parse --verify -q "${CLONE_SHA}^{commit}" >/dev/null; then
            git_auth fetch -q --force origin "$CLONE_SHA"
          fi
          git checkout -q --force "$CLONE_SHA"
          echo "checked out $(git rev-parse HEAD) ($(git rev-list --count HEAD) commits)"
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: "1.2.0"
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Install PostgreSQL client and libpq headers
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client
          else
            apt-get update
            apt-get install -y --no-install-recommends libpq-dev postgresql-client
          fi

      - name: Prepare test database
        # 扩展 + bench_rows 种子（CTE/LATERAL/DISTINCT ON smoke 与物化基准依赖）。
        # 大结果集基准（13,335 行）在 CI 环境抖动大，种子保持同规模以复现测试断言。
        run: |
          set -eux
          PSQL="psql $PG_DSN -v ON_ERROR_STOP=1"
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS unaccent'
          $PSQL -c "CREATE TABLE IF NOT EXISTS bench_rows(id bigserial primary key, title text, filename text, summary text, tags text, extra text, n1 int, n2 bigint, f1 float8, b1 bool, t1 timestamptz, by1 bytea, j1 jsonb)"
          $PSQL -c "INSERT INTO bench_rows(title, filename, summary, tags, extra, n1, n2, f1, b1, t1, by1, j1) SELECT '漫画标题编号'||i, 'file_'||i||'.zip', 'summary text '||i, 'tag_a,tag_b,tag_'||(i%50), 'x', i%100, i*7, i*0.5, i%2=0, now() - (i||' hours')::interval, ('\\x'||md5(i::text))::bytea, jsonb_build_object('k', i) FROM generate_series(1,13335) s(i) ON CONFLICT DO NOTHING"

      - name: Pre-generate C bridge static lib
        # postgresql-driver 的 [ffi.c] 在 cjpm update 阶段校验 liblanlu_pg_bridge.a 存在
        # （产物被 gitignore，fresh checkout 不存在）；与 rocksdb bridge 同款预生成。
        run: |
          set -eux
          cc -O2 -fPIC -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o

      - name: Run csorm tests
        run: |
          set -eux
          cd packages/csorm
          cjpm test

      - name: Run postgresql-driver tests
        run: |
          set -eux
          cd packages/postgresql-driver
          cjpm test

  server-test:
    # 根包 12 个用例。数据库用例连不上库时会静默打印 [skip] 并返回成功，
    # 因此本 job 同时提供 PostgreSQL 服务并在测试后把 [skip] 视为失败。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pgtest
          POSTGRES_DB: lanlutest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_STRING: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable&pool.max=5
      # psql(libpq) 不认驱动特有的 pool.* 查询参数，建扩展时用无 pool 的 DSN。
      PG_DSN: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable
      XMAKE_ROOT: "y"
      WASMEDGE_REPO_DIR: ${{ github.workspace }}/build-script-cache/WasmEdge
    steps:
      - name: Check out repository code
        env:
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CLONE_SHA: ${{ github.sha }}
          CLONE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 不用 actions/checkout：该 action 每次运行都要从 github.com 拉取 action 本体，
          # runner 出口网络抖动时会在 job 初始化阶段整体失败（run 1502 server-test：
          # "could not fetch remote 'origin': Recv failure: Connection reset by peer"）。
          # 这里改为直接向本实例 fetch。为了不引入语义变化，一次拉全部分支、tags 与
          # PR head：比 actions/checkout 默认的 depth=1 更宽，affected/守卫的 git 依赖不受影响。
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-$PWD}"
          # 复用工作目录时 .git 可能损坏（上一轮被中断），用 rev-parse 探测而不是只看目录存在。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            rm -rf .git
            git init -q
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$CLONE_URL"
          else
            git remote add origin "$CLONE_URL"
          fi
          # 自托管 runner 复用工作目录时，上一轮的未跟踪文件会挡住 checkout。
          git clean -ffdxq
          # 认证用环境变量而不是 `git -c http.extraheader=...`：后者会把 token 写进
          # 进程 argv，同机任意用户 `ps` 可见。GIT_CONFIG_* 只进进程 environ，作用域
          # 限于本 step 的 shell（函数内前置赋值，不 export，不影响后续步骤）。
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: token ${CLONE_TOKEN}" git "$@"
          }
          if ! git_auth fetch -q --prune --force origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              '+refs/pull/*/head:refs/remotes/pull/*'; then
            echo "fetch 失败：$CLONE_URL（检查 github.token 是否对该仓库有读权限）" >&2
            exit 1
          fi
          # actions/checkout 默认 depth=1，复用旧工作区时仓库可能是 shallow 的；
          # 补齐历史，避免依赖 git 历史的步骤（affected、计数类守卫）静默失真。
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git_auth fetch -q --unshallow --tags origin || {
              echo "解除 shallow 失败：$CLONE_URL" >&2; exit 1; }
          fi
          # pull_request 事件的 github.sha 可能是服务端生成的合并提交，不在 heads/tags/pull
          # 任何一个 ref 上；此时按 SHA 直接取（Forgejo 支持按 SHA fetch，本机已实测）。
          if ! git rev-parse --verify -q "${CLONE_SHA}^{commit}" >/dev/null; then
            git_auth fetch -q --force origin "$CLONE_SHA"
          fi
          git checkout -q --force "$CLONE_SHA"
          echo "checked out $(git rev-parse HEAD) ($(git rev-list --count HEAD) commits)"
      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: "1.2.0"
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Install build tools
        run: |
          set -eux
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev postgresql-client libsqlite3-dev libmysqlclient-dev
          else
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev postgresql-client libsqlite3-dev libmysqlclient-dev
          fi

      - name: Prepare test database extensions
        # 根测试并行跑迁移时，X013UACC 可能因 V013 尚未落库而跳过；unaccent 缺失会让
        # 搜索文档用例直接报 "function unaccent(text) does not exist"。与 orm-test 一致，
        # 先把扩展建好，迁移只负责索引与包装函数。
        run: |
          set -eux
          PSQL="psql $PG_DSN -v ON_ERROR_STOP=1"
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS unaccent'

      - name: Checkout WasmEdge source (public)
        run: |
          set -eux
          mkdir -p build-script-cache
          # 上行动网抖动时 clone 会静默挂住（run 1490/1506 各出现一次，其中一次挂 22 分钟
          # 占死单 runner）。加 300s 看门狗 + 单次重试：第一次的失败输出已由 set -x 留在
          # 日志里，第二次仍失败则显式退出，不掩盖真实错误。
          clone_wasmedge() {
            timeout 300 git clone https://github.com/WasmEdge/WasmEdge build-script-cache/WasmEdge
          }
          if ! clone_wasmedge; then
            echo "::warning::WasmEdge clone 首次失败或超时，清理残留后重试一次"
            rm -rf build-script-cache/WasmEdge
            clone_wasmedge
          fi

      - name: Pre-generate C bridge static libs
        run: |
          set -eux
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          cc -O2 -fPIC \
            -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o

      - name: Resolve dependencies and guard lock
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          # PR6：服务端 manifest 已迁到 apps/server。cjpm 的 target/ 与
          # build-script-cache/ 都以 CWD 为基准，必须进入包目录再跑。
          # git 的 pathspec 相对 CWD 解析，故此处 cjpm.lock 即 apps/server/cjpm.lock。
          cd apps/server
          cjpm update
          if ! git diff --exit-code -- cjpm.lock; then
            git diff -- cjpm.lock || true
            echo "::error::cjpm.lock changed during dependency resolution; migrate and commit the lock before testing"
            exit 1
          fi
          for f in $(find "$HOME/.cjpm/git/wasmedge_ffi" -type f -name build_native.sh 2>/dev/null); do
            grep -q "^unset GIT_DIR GIT_WORK_TREE$" "$f" || sed -i "2iunset GIT_DIR GIT_WORK_TREE" "$f"
            grep -q -- "-Wno-error=stringop-truncation" "$f" || sed -i "s/-Wno-array-bounds/-Wno-array-bounds -Wno-error=stringop-truncation/" "$f"
          done

      - name: Run root package tests
        run: |
          set -euo pipefail
          cd apps/server
          mkdir -p target/test-results
          cjpm test \
            --no-color \
            --timeout-each 60s \
            --show-all-output \
            --report-path "$PWD/target/test-results/server" \
            --report-format xml \
            2>&1 | tee target/test-results/server-test.log
          if grep -Fq '[skip]' target/test-results/server-test.log; then
            echo "::error::Database tests printed [skip]; PostgreSQL prerequisites are not ready"
            exit 1
          fi

      - name: Upload root test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: server-test-results
          path: apps/server/target/test-results/
          if-no-files-found: warn

  build:
    # Keep the build container on the exact runtime-image snapshot. Linking on
    # a bare runner gives the binary an Ubuntu 24.04 soname while Dockerfile
    # provides Ubuntu 26.04 libraries, so package smoke fails at startup.
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    env:
      # xmake refuses to run as root unless explicitly allowed. Some CI runners execute as root.
      XMAKE_ROOT: 'y'
    steps:
      - name: Prepare container for Node actions
        # 该镜像不自带 git/node：git 供下面的 clone 步骤使用，node 供后续
        # 仍以 `uses:` 形式运行的 action（setup-cangjie 等）使用。
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git nodejs
          node --version
          git --version

      - name: Check out repository code
        env:
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CLONE_SHA: ${{ github.sha }}
          CLONE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 不用 actions/checkout：该 action 每次运行都要从 github.com 拉取 action 本体，
          # runner 出口网络抖动时会在 job 初始化阶段整体失败（run 1502 server-test：
          # "could not fetch remote 'origin': Recv failure: Connection reset by peer"）。
          # 这里改为直接向本实例 fetch。为了不引入语义变化，一次拉全部分支、tags 与
          # PR head：比 actions/checkout 默认的 depth=1 更宽，affected/守卫的 git 依赖不受影响。
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-$PWD}"
          # 复用工作目录时 .git 可能损坏（上一轮被中断），用 rev-parse 探测而不是只看目录存在。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            rm -rf .git
            git init -q
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$CLONE_URL"
          else
            git remote add origin "$CLONE_URL"
          fi
          # 自托管 runner 复用工作目录时，上一轮的未跟踪文件会挡住 checkout。
          git clean -ffdxq
          # 认证用环境变量而不是 `git -c http.extraheader=...`：后者会把 token 写进
          # 进程 argv，同机任意用户 `ps` 可见。GIT_CONFIG_* 只进进程 environ，作用域
          # 限于本 step 的 shell（函数内前置赋值，不 export，不影响后续步骤）。
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: token ${CLONE_TOKEN}" git "$@"
          }
          if ! git_auth fetch -q --prune --force origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              '+refs/pull/*/head:refs/remotes/pull/*'; then
            echo "fetch 失败：$CLONE_URL（检查 github.token 是否对该仓库有读权限）" >&2
            exit 1
          fi
          # actions/checkout 默认 depth=1，复用旧工作区时仓库可能是 shallow 的；
          # 补齐历史，避免依赖 git 历史的步骤（affected、计数类守卫）静默失真。
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git_auth fetch -q --unshallow --tags origin || {
              echo "解除 shallow 失败：$CLONE_URL" >&2; exit 1; }
          fi
          # pull_request 事件的 github.sha 可能是服务端生成的合并提交，不在 heads/tags/pull
          # 任何一个 ref 上；此时按 SHA 直接取（Forgejo 支持按 SHA fetch，本机已实测）。
          if ! git rev-parse --verify -q "${CLONE_SHA}^{commit}" >/dev/null; then
            git_auth fetch -q --force origin "$CLONE_SHA"
          fi
          git checkout -q --force "$CLONE_SHA"
          echo "checked out $(git rev-parse HEAD) ($(git rev-list --count HEAD) commits)"
      # - name: Setup Cangjie
      #   uses: Zxilly/setup-cangjie@v2
      #   with:
      #   channel: lts
      #   version: auto
      - name: Install build tools
        run: |
          set -eux

          # Match the pinned tar in .ide/Dockerfile for the 26.04 snapshot.
          apt-get update
          apt-get install -y --no-install-recommends --allow-downgrades tar=1.35+dfsg-4
          apt-get install -y --no-install-recommends \
            ca-certificates curl git wget unzip zip xz-utils \
            build-essential clang ninja-build cmake binutils \
            xmake \
            pkg-config \
            libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
            libvips-dev libheif-dev librocksdb-dev \
            libpq-dev postgresql-client libsqlite3-dev libmysqlclient-dev

      - name: Verify xmake
        run: |
          set -eux
          xmake --version
      - name: Unzip Cangjie
        run: |
          wget -O c.tar.gz "${{ vars.CANGJIE_URL }}"
          tar --no-same-owner --no-same-permissions --touch -xzvf c.tar.gz
          wget -O s.zip "${{ vars.STDX_URL }}"
          unzip s.zip -d stdx
      - name: Checkout WasmEdge source (public)
        # 不用 actions/checkout 拉：默认向本实例查询 wasmedge 用户，
        # 报 "user redirect does not exist [name: wasmedge]"（run 985/993）。
        # 公开仓库直接 clone；不带 --depth 等价 fetch-depth: 0（全历史+tags）。
        run: |
          set -eux
          mkdir -p build-script-cache
          # 上行动网抖动时 clone 会静默挂住（run 1490/1506 各出现一次，其中一次挂 22 分钟
          # 占死单 runner）。加 300s 看门狗 + 单次重试：第一次的失败输出已由 set -x 留在
          # 日志里，第二次仍失败则显式退出，不掩盖真实错误。
          clone_wasmedge() {
            timeout 300 git clone https://github.com/WasmEdge/WasmEdge build-script-cache/WasmEdge
          }
          if ! clone_wasmedge; then
            echo "::warning::WasmEdge clone 首次失败或超时，清理残留后重试一次"
            rm -rf build-script-cache/WasmEdge
            clone_wasmedge
          fi
      - name: Set Up Cangjie and build
        run: |
          export CANGJIE_STDX_PATH="$PWD/stdx/linux_x86_64_cjnative/static/stdx"
          export WASMEDGE_REPO_DIR="$PWD/build-script-cache/WasmEdge"
          unset GIT_DIR GIT_WORK_TREE
          # ln -s "$PWD/stdx/linux_x86_64_cjnative" "$PWD/stdx/linux_x86_64_llvm"
          source cangjie/envsetup.sh
          # rocksdb_ffi 的 [ffi.c] 校验发生在 cjpm update 阶段，早于 build.cj 的
          # pre-build 钩子；fresh checkout 下 liblanlu_rocksdb_bridge.a 被 gitignore
          # 不存在，update 直接报 "can not find the library"。这里按 build.cj 的
          # 同款命令预生成（build 阶段 pre-build 会幂等重编，无冲突）。
          # （对齐 .github/workflows/build.yml 的既有 workaround，run 1001 实测缺它必挂）
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          # postgresql-driver 的 lanlu_pg_bridge 同理（C bridge，用 cc 而非 g++，
          # 需要 libpq 头文件）。缺它时 cjpm update 报 "can not find the library
          # 'lanlu_pg_bridge'"。
          cc -O2 -fPIC \
            -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o
          # PR6：manifest 在 apps/server。C 桥仍从仓库根预生成（路径不变），
          # 但 cjpm 的 target/ 与 build-script-cache/ 跟随 CWD，必须进包目录。
          cd apps/server
          cjpm update
          if ! git diff --exit-code -- cjpm.lock; then
            git diff -- cjpm.lock || true
            echo "::error::cjpm.lock changed during dependency resolution; migrate and commit the lock before building"
            exit 1
          fi
          for f in $(find "$HOME/.cjpm/git/wasmedge_ffi" -type f -name build_native.sh 2>/dev/null); do
            grep -q "^unset GIT_DIR GIT_WORK_TREE$" "$f" || sed -i "2iunset GIT_DIR GIT_WORK_TREE" "$f"
            # Newer runner GCC flags vendored wasm.hh strncpy as -Wstringop-truncation.
            # WasmEdge appends its own -Werror after CMAKE_CXX_FLAGS, which overrides
            # the blanket -Wno-error in the script default; only a warning-specific
            # -Wno-error=... survives, so append one to the CXX flags default.
            grep -q -- "-Wno-error=stringop-truncation" "$f" || sed -i "s/-Wno-array-bounds/-Wno-array-bounds -Wno-error=stringop-truncation/" "$f"
          done
          cjc -v
          cjpm build -V

      - name: Run lcodec tests
        # lcodec 单测 17 例。图片后端运行时 dlopen libvips，build job 已安装。
        run: |
          set -eux
          export CANGJIE_STDX_PATH="$PWD/stdx/linux_x86_64_cjnative/static/stdx"
          # envsetup.sh 第 48 行直接展开 $LD_LIBRARY_PATH，set -u 下会 unbound variable。
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          unset GIT_DIR GIT_WORK_TREE
          source cangjie/envsetup.sh
          cd packages/lcodec
          cjpm test --no-color --timeout-each 60s

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Setup pnpm (corepack)
        run: |
          set -eux
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm -v
      - name: Install frontend dependencies
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: |
          cd apps/web
          pnpm run typecheck
      - name: Test frontend
        run: |
          cd apps/web
          pnpm run test:ci
      - name: Build frontend
        run: |
          cd apps/web
          pnpm run build
      - name: Prepare release artifacts
        run: |
          mkdir -p app
          mkdir -p app/frontend
          cp apps/server/target/release/bin/main app/
          cp -r apps/web/out app/frontend/out
      - name: Archive production artifacts
        # v4 的 @actions/artifact 2.x 走 GitHub Artifact v2 协议，Forgejo 未实现，
        # 报 GHESNotSupportedError（run #1264）；v3 旧协议 Forgejo 兼容。
        uses: actions/upload-artifact@v3
        with:
          name: release
          path: |
            app/main
            app/frontend
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        env:
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CLONE_SHA: ${{ github.sha }}
          CLONE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 不用 actions/checkout：该 action 每次运行都要从 github.com 拉取 action 本体，
          # runner 出口网络抖动时会在 job 初始化阶段整体失败（run 1502 server-test：
          # "could not fetch remote 'origin': Recv failure: Connection reset by peer"）。
          # 这里改为直接向本实例 fetch。为了不引入语义变化，一次拉全部分支、tags 与
          # PR head：比 actions/checkout 默认的 depth=1 更宽，affected/守卫的 git 依赖不受影响。
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          cd "${GITHUB_WORKSPACE:-$PWD}"
          # 复用工作目录时 .git 可能损坏（上一轮被中断），用 rev-parse 探测而不是只看目录存在。
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            rm -rf .git
            git init -q
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$CLONE_URL"
          else
            git remote add origin "$CLONE_URL"
          fi
          # 自托管 runner 复用工作目录时，上一轮的未跟踪文件会挡住 checkout。
          git clean -ffdxq
          # 认证用环境变量而不是 `git -c http.extraheader=...`：后者会把 token 写进
          # 进程 argv，同机任意用户 `ps` 可见。GIT_CONFIG_* 只进进程 environ，作用域
          # 限于本 step 的 shell（函数内前置赋值，不 export，不影响后续步骤）。
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="Authorization: token ${CLONE_TOKEN}" git "$@"
          }
          if ! git_auth fetch -q --prune --force origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' \
              '+refs/pull/*/head:refs/remotes/pull/*'; then
            echo "fetch 失败：$CLONE_URL（检查 github.token 是否对该仓库有读权限）" >&2
            exit 1
          fi
          # actions/checkout 默认 depth=1，复用旧工作区时仓库可能是 shallow 的；
          # 补齐历史，避免依赖 git 历史的步骤（affected、计数类守卫）静默失真。
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git_auth fetch -q --unshallow --tags origin || {
              echo "解除 shallow 失败：$CLONE_URL" >&2; exit 1; }
          fi
          # pull_request 事件的 github.sha 可能是服务端生成的合并提交，不在 heads/tags/pull
          # 任何一个 ref 上；此时按 SHA 直接取（Forgejo 支持按 SHA fetch，本机已实测）。
          if ! git rev-parse --verify -q "${CLONE_SHA}^{commit}" >/dev/null; then
            git_auth fetch -q --force origin "$CLONE_SHA"
          fi
          git checkout -q --force "$CLONE_SHA"
          echo "checked out $(git rev-parse HEAD) ($(git rev-list --count HEAD) commits)"
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: release
          path: ./app/
      - name: Set execute permissions
        run: chmod +x ./app/main
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildkitd 跑在 dind 内的独立容器里，不读 dockerd 的 registry 加速配置；
          # 国内直连 registry-1.docker.io 被拒（run 1680：FROM ubuntu:26.04 处
          #   dial tcp 108.160.162.104:443: connect: connection refused），
          # 所以在这里直接把 docker.io 的 mirror 交给 buildkitd。
          # 官方输入：docker/setup-buildx-action 的 buildkitd-config-inline
          # （action.yml: "Inline BuildKit daemon config"）。
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["docker.1ms.run"]
      - name: Resolve image metadata
        id: image_meta
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          registry="${SERVER_URL#https://}"
          registry="${registry#http://}"
          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY##*/}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tag="latest"
          else
            tag="dev-$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g')"
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$owner/$repo:${tag}" >> "$GITHUB_OUTPUT"
      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image_meta.outputs.registry }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: lanlu:smoke
          cache-from: type=registry,ref=${{ steps.image_meta.outputs.image }}-cache
          cache-to: type=registry,ref=${{ steps.image_meta.outputs.image }}-cache,mode=max

      - name: Smoke test image
        run: bash ./scripts/docker-smoke-test.sh lanlu:smoke

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.image }}
          cache-from: type=registry,ref=${{ steps.image_meta.outputs.image }}-cache

