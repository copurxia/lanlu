<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanlu 书架重设计 · 交互原型（收藏 / 阅读历史）</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-elev: #16161a;
    --bg-card: #131316;
    --bg-capsule: rgba(22,22,26,.82);
    --border: rgba(255,255,255,.08);
    --text: #e8e8ea;
    --text-dim: #9a9aa2;
    --accent: #e8b04b;
    --accent-soft: rgba(232,176,75,.16);
    --danger: #e05d5d;
    --success: #4caf7d;
    --radius: 14px;
    --font: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html,body { height: 100%; }
  body { background: #333; font-family: var(--font);
         display: flex; align-items: center; justify-content: center; }
  button { font-family: inherit; color: var(--text); background: transparent; border: none; cursor: pointer; }

  #window {
    width: min(1320px, 96vw); height: min(860px, 94vh);
    color: var(--text);  /* 文字色必须在 #window 层解析，主题切换才会级联 */
    background: var(--bg); border-radius: 12px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    position: relative; display: flex; flex-direction: column;
  }

  /* ============ 顶栏（全局，与各 redesign 一致） ============ */
  #topbar {
    height: 56px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border);
    background: var(--bg-capsule); backdrop-filter: blur(18px); z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #b0782a);
      display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .search-shell { flex: 0 1 460px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; color: var(--text-dim); font-size: 13px; cursor: text; transition: .15s; }
  .search-shell:focus-within, .search-shell:hover { border-color: rgba(232,176,75,.4); }
  .search-shell input { flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 13px; font-family: inherit; }
  .nav-pill { display: flex; background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px; gap: 2px; }
  .nav-pill button { padding: 6px 14px; font-size: 12.5px; border-radius: 999px; color: var(--text-dim); }
  .nav-pill button.on { background: var(--accent-soft); color: var(--accent); }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; display: inline-flex;
      align-items: center; justify-content: center; font-size: 16px;
      color: var(--text-dim); transition: .15s; flex: none; }
  .icon-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .icon-btn.active { color: var(--accent); background: var(--accent-soft); }
  .user-chip { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px;
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px;
      font-size: 12px; color: var(--text-dim); }
  .avatar { width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg,#4a6fa5,#2b3a55);
      display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }

  /* ============ 主体布局 ============ */
  #lib-body { flex: 1; display: flex; min-height: 0; }

  /* 左侧书架导航 */
  #lib-side { width: 224px; flex: none; border-right: 1px solid var(--border);
      overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .side-sec { font-size: 11px; color: var(--text-dim); letter-spacing: .1em; padding: 12px 10px 6px; }
  .side-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      border-radius: 9px; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: .13s; }
  .side-item:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .side-item.on { background: var(--accent-soft); color: var(--accent); }
  .side-item .cnt { margin-left: auto; font-size: 11px; opacity: .7; }
  .side-item .si { width: 18px; text-align: center; flex: none; }

  /* 主区 */
  #lib-main { flex: 1; overflow-y: auto; padding: 18px 22px 40px; scroll-behavior: smooth; }

  /* 工具行：标题 + 统计 + 排序 + 刷新 */
  .feed-tools { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .feed-tools h2 { font-size: 20px; font-weight: 600; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
  .feed-tools .sp { flex: 1; }
  .feed-tools .lb { font-size: 12px; color: var(--text-dim); }
  .sel { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 9px;
      padding: 7px 10px; font-size: 12.5px; color: var(--text-dim);
      display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .sel:hover { border-color: rgba(232,176,75,.4); color: var(--text); }
  .btn-ghost { display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
      padding: 7px 13px; border-radius: 9px; border: 1px solid var(--border);
      color: var(--text-dim); transition: .15s; }
  .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .btn-ghost.spin .r-ico { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tab（收藏 / 历史）：小屏侧栏收起时的备用切换，也与侧栏联动 */
  .tab-pill { display: flex; background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px; gap: 2px; }
  .tab-pill button { padding: 6px 14px; font-size: 12.5px; border-radius: 999px;
      color: var(--text-dim); transition: .13s; }
  .tab-pill button.on { background: var(--accent-soft); color: var(--accent); }

  /* ============ 卡片（与 home-view-switch 一致） ============ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px 14px; animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
  .card { width: 100%; cursor: pointer; }
  .card .cover { width: 100%; aspect-ratio: 3/4; border-radius: 12px; position: relative;
      overflow: hidden; border: 1px solid var(--border);
      transition: transform .18s ease, box-shadow .18s ease; }
  .card:hover .cover { transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(0,0,0,.5); outline: 1px solid rgba(232,176,75,.45); }
  .cover .ph { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 34px; opacity: .4; }
  .cover .badge-new { position: absolute; top: 8px; right: 8px; background: var(--danger);
      color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
  .badge-type { background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px); font-size: 10.5px; padding: 3px 8px; border-radius: 6px;
      color: #f2f2f4;  /* 叠层语义：封面上的 chip 不随主题翻转 */
      display: flex; gap: 4px; align-items: center; }
  .badge-type.tank { color: var(--accent); }
  .cover .badge-type { position: absolute; top: 8px; left: 8px; }
  .cover .fav { position: absolute; bottom: 8px; right: 8px; width: 28px; height: 28px;
      border-radius: 50%; background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; font-size: 13px;
      color: #fff; opacity: 0; transition: .15s; }
  .card:hover .fav, .fav.on { opacity: 1; }
  .fav.on { color: var(--accent); }
  .cover .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: rgba(255,255,255,.15); }
  .cover .prog i { display: block; height: 100%; background: var(--accent); }
  /* 合集叠层效果 */
  .card.tank .stack { position: absolute; inset: 0; }
  .card.tank .stack::before, .card.tank .stack::after {
      content: ""; position: absolute; inset: 0; border-radius: 12px;
      background: linear-gradient(160deg,#22304a,#10151f); border: 1px solid var(--border); }
  .card.tank .stack::before { transform: translate(5px,-5px) scale(.96); z-index: -1; }
  .card .t { margin-top: 8px; font-size: 12.5px; line-height: 1.4;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .m { font-size: 11px; color: var(--text-dim); margin-top: 2px; display: flex;
      align-items: center; gap: 6px; }
  .card .m .pct { color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ============ 历史：时间分组 ============ */
  .tgroup { margin-bottom: 26px; animation: fadeUp .35s ease both; }
  .tgroup .tg-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px;
      position: sticky; top: -18px; z-index: 5; padding: 6px 0;
      background: var(--bg); }
  .tgroup .tg-head h3 { font-size: 14px; font-weight: 600; }
  .tgroup .tg-head .cnt { font-size: 11.5px; color: var(--text-dim); }
  .tgroup .tg-head .line { flex: 1; height: 1px; background: var(--border); align-self: center; }

  /* 继续阅读横幅（历史 Tab 顶部，对齐“上次读到”场景） */
  .resume { display: flex; gap: 16px; align-items: center; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 24px; cursor: pointer; transition: .14s; }
  .resume:hover { border-color: rgba(232,176,75,.35); }
  .resume .rc { width: 64px; height: 86px; border-radius: 9px; flex: none;
      border: 1px solid var(--border); position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .resume .rmid { flex: 1; min-width: 0; }
  .resume .rk { font-size: 11px; color: var(--accent); letter-spacing: .06em; }
  .resume .rt { font-size: 14.5px; font-weight: 600; margin-top: 4px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
  .resume .rm { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  .resume .rbar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); margin-top: 10px; }
  .resume .rbar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
  .btn-primary { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
      padding: 9px 18px; border-radius: 10px; background: var(--accent); color: #1a1206;
      font-weight: 600; transition: .15s; flex: none; }
  .btn-primary:hover { filter: brightness(1.08); }

  /* 空态 / 未登录 */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px 0; text-align: center; color: var(--text-dim); gap: 6px; }
  .empty .ei { font-size: 42px; opacity: .4; margin-bottom: 8px; }
  .empty p { font-size: 13px; }
  .empty .sub { font-size: 11.5px; opacity: .75; }

  /* demo 工具条 */
  #demo-bar { position: fixed; top: 8px; left: 8px; z-index: 99; display: flex; gap: 6px;
      background: rgba(0,0,0,.7); border: 1px solid #444; border-radius: 10px; padding: 6px; }
  #demo-bar button { font-size: 11px; color: #ccc; padding: 5px 9px; border-radius: 7px;
      border: 1px solid #444; }
  #demo-bar button.on { background: var(--accent); color: #000; border-color: var(--accent); }

  /* ============ 窗口控制 ============ */
  .win-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; flex: none; }
  .win-controls { display: flex; gap: 2px; flex: none; }
  .win-btn { width: 38px; height: 30px; border-radius: 7px; font-size: 12px;
      color: var(--text-dim); display: inline-flex; align-items: center;
      justify-content: center; transition: .13s; }
  .win-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .win-btn.close:hover { background: #e81123; color: #fff; }
  #window.light .win-btn:hover { background: rgba(0,0,0,.07); }
  #window.light .win-btn.close:hover { background: #e81123; color: #fff; }

  /* ============ 明亮主题 ============ */
  #window.light {
    --bg: #f4f4f6; --bg-elev: #ffffff; --bg-card: #ffffff;
    --bg-capsule: rgba(255,255,255,.88);
    --border: rgba(0,0,0,.1); --text: #1d1d21; --text-dim: #6d6d76;
    --accent: #c78a1e; --accent-soft: rgba(199,138,30,.14);
  }
  #window.light .icon-btn:hover { background: rgba(0,0,0,.06); }
  #window.light .side-item:hover { background: rgba(0,0,0,.05); }
  #window.light .cover .prog, #window.light .resume .rbar { background: rgba(0,0,0,.12); }
  #window.light .cover .fav { color: #fff; }
  #window.light .avatar { color: #fff; }
</style>
</head>
<body>

<div id="demo-bar">
  <span style="font-size:11px;color:#888;padding:5px 4px">书架:</span>
  <button data-v="favorites" class="on">收藏</button>
  <button data-v="history">阅读历史</button>
  <button data-v="empty">空态</button>
  <button data-v="guest">未登录</button>
</div>

<div id="window">
  <!-- 全局顶栏 -->
  <div id="topbar">
    <div class="brand"><div class="brand-mark">🦌</div><b>Lanlu</b></div>
    <div class="search-shell">
      <span>⌕</span>
      <input id="search-input" placeholder="在书架中搜索标题 / 标签…">
    </div>
    <div class="nav-pill">
      <button>首页</button><button class="on">书架</button><button>来源</button>
    </div>
    <button class="icon-btn" title="设置">⚙</button>
    <button class="icon-btn" id="btn-theme" title="明暗切换">◐</button>
    <div class="user-chip"><div class="avatar">U</div>user</div>
    <div class="win-sep"></div>
    <div class="win-controls">
      <button class="win-btn" title="最小化">—</button>
      <button class="win-btn" title="最大化">▢</button>
      <button class="win-btn close" title="关闭">✕</button>
    </div>
  </div>

  <div id="lib-body">
    <!-- 左侧书架导航 -->
    <aside id="lib-side">
      <div class="side-sec">书架</div>
      <div class="side-item on" data-tab="favorites"><span class="si">♥</span>我的收藏<span class="cnt" id="cnt-fav">0</span></div>
      <div class="side-item" data-tab="history"><span class="si">🕘</span>阅读历史<span class="cnt" id="cnt-his">0</span></div>
      <div class="side-sec">快捷筛选</div>
      <div class="side-item" data-filter="unread"><span class="si">●</span>未读完</div>
      <div class="side-item" data-filter="tank"><span class="si">📚</span>仅合集</div>
      <div class="side-item" data-filter="new"><span class="si">✦</span>新入库</div>
    </aside>

    <!-- 主区 -->
    <main id="lib-main">
      <div class="feed-tools">
        <h2 id="page-title">我的收藏</h2>
        <div class="tab-pill" id="tab-pill">
          <button data-tab="favorites" class="on">收藏</button>
          <button data-tab="history">历史</button>
        </div>
        <div class="sp"></div>
        <span class="lb" id="stats-label"></span>
        <div class="sel" id="sort-sel">⇅ <span id="sort-label">最近添加</span> ▾</div>
        <button class="btn-ghost" id="btn-refresh"><span class="r-ico">⟳</span>刷新</button>
      </div>

      <!-- 收藏视图 -->
      <div id="view-favorites">
        <div class="grid" id="fav-grid"></div>
      </div>

      <!-- 历史视图 -->
      <div id="view-history" style="display:none">
        <div class="resume" id="resume-banner">
          <div class="rc">🎨</div>
          <div class="rmid">
            <div class="rk">继续阅读 · 第 17 页 / 共 214 页</div>
            <div class="rt" id="resume-title">[Demo Artist] 午后图书馆的秘密集会</div>
            <div class="rm">2 小时前读到此处 · artist:demo artist, language:chinese</div>
            <div class="rbar"><i style="width:8%"></i></div>
          </div>
          <button class="btn-primary">▶ 继续阅读</button>
        </div>
        <div id="history-groups"></div>
      </div>

      <!-- 空态 / 未登录 -->
      <div class="empty" id="view-empty" style="display:none">
        <div class="ei">🗂️</div>
        <p id="empty-text">书架还是空的</p>
        <p class="sub" id="empty-sub">去首页逛逛，把喜欢的归档加入收藏吧</p>
      </div>
    </main>
  </div>
</div>

<script>
/* ================= demo 数据 ================= */
const TITLES = [
  '[C104] 夏日终焉的海边物语', '[Demo Artist] 午后图书馆的秘密集会',
  '星空下的约定 总集篇', '[同人誌] 铁道少女漫游记录', '深夜食堂的猫又小姐',
  '[Fanbox] 魔女宅急便 番外篇', '机械少女与旧书店', '[COMIC1] 青梅竹马的距离感',
  '雪国列车终点站', '[DLsite] 勇者辞职之后的慢生活', '月见之丘的狐狸嫁娶',
  '[画集] 四季彩 – 春', '天台上的天文部', '[再録] 时间停止便利屋',
  '猫咪咖啡馆营业中', '[新刊] 放学后的炼金工房', '海边的移动书屋', '[总集编] 青春速写 2019-2024'
];
const ARTISTS = ['demo artist','nekomi','sorairo','kikaku-do','yuzuha','atelier-k'];
const TAGSETS = [
  'artist:nekomi, language:chinese, parody:original',
  'artist:sorairo, group:kikaku-do, language:chinese',
  'artist:yuzuha, language:japanese, full color',
  'artist:atelier-k, language:chinese, tankoubon',
  'group:atelier-k, language:chinese, scanlated'
];
const HUES = [14, 36, 52, 200, 222, 264, 320, 160, 96, 280];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function makeItem(i) {
  const tank = Math.random() < .22;
  const pages = tank ? rnd(4, 12) * 30 : rnd(40, 260);
  const read = Math.random() < .75 ? Math.min(pages, Math.floor(pages * Math.random())) : 0;
  return {
    id: 'a' + i,
    title: pick(TITLES),
    tags: pick(TAGSETS),
    artist: pick(ARTISTS),
    kind: tank ? 'tank' : 'arc',
    pages,
    read,
    isnew: Math.random() < .18,
    hue: pick(HUES),
    lastread: rnd(0, 72), // 小时前
  };
}

const favItems = Array.from({ length: 26 }, (_, i) => makeItem(i));
const hisItems = Array.from({ length: 30 }, (_, i) => makeItem(100 + i))
  .sort((a, b) => a.lastread - b.lastread);

/* ================= 渲染 ================= */
const favGrid = document.getElementById('fav-grid');
const hisWrap = document.getElementById('history-groups');
let curTab = 'favorites';
let curFilter = '';      // 快捷筛选：unread / tank / new
let query = '';

function coverBg(it) {
  return `background:linear-gradient(155deg,hsl(${it.hue},32%,26%),hsl(${(it.hue + 30) % 360},28%,14%))`;
}

function cardHTML(it, showLastread) {
  const pct = it.pages ? Math.round(it.read / it.pages * 100) : 0;
  const meta = showLastread
    ? `${it.lastread < 1 ? '刚刚' : it.lastread < 24 ? it.lastread + ' 小时前' : Math.floor(it.lastread / 24) + ' 天前'} · ${it.pages} 页`
    : `${it.pages} 页 · ${it.artist}`;
  return `
  <div class="card ${it.kind === 'tank' ? 'tank' : ''}" data-id="${it.id}">
    <div class="cover" style="${coverBg(it)}">
      ${it.kind === 'tank' ? '<div class="stack"></div>' : ''}
      <div class="ph">${it.kind === 'tank' ? '📚' : '🖼️'}</div>
      ${it.kind === 'tank' ? '<span class="badge-type tank">📚 合集</span>' : ''}
      ${it.isnew ? '<span class="badge-new">NEW</span>' : ''}
      <div class="fav ${curTab === 'favorites' ? 'on' : ''}">♥</div>
      ${pct > 0 ? `<div class="prog"><i style="width:${pct}%"></i></div>` : ''}
    </div>
    <div class="t">${it.title}</div>
    <div class="m"><span>${meta}</span>${pct > 0 && pct < 100 ? `<span class="pct">${pct}%</span>` : ''}</div>
  </div>`;
}

function matchQuery(it) {
  if (!query) return true;
  const q = query.toLowerCase();
  return it.title.toLowerCase().includes(q) || it.tags.toLowerCase().includes(q);
}
function matchFilter(it) {
  if (curFilter === 'unread') return it.read > 0 && it.read < it.pages;
  if (curFilter === 'tank') return it.kind === 'tank';
  if (curFilter === 'new') return it.isnew;
  return true;
}
const visible = it => matchQuery(it) && matchFilter(it);

function renderFavorites() {
  const list = favItems.filter(visible);
  favGrid.innerHTML = list.map(it => cardHTML(it, false)).join('');
  document.getElementById('stats-label').textContent = `共 ${list.length} 项`;
}

function renderHistory() {
  const list = hisItems.filter(visible);
  const groups = [
    { key: 'today', label: '今天', test: it => it.lastread < 24 },
    { key: 'week', label: '本周', test: it => it.lastread >= 24 && it.lastread < 24 * 7 },
    { key: 'earlier', label: '更早', test: it => it.lastread >= 24 * 7 },
  ];
  hisWrap.innerHTML = groups.map(g => {
    const items = list.filter(g.test);
    if (!items.length) return '';
    return `
    <div class="tgroup">
      <div class="tg-head"><h3>${g.label}</h3><span class="cnt">${items.length} 项</span><span class="line"></span></div>
      <div class="grid">${items.map(it => cardHTML(it, true)).join('')}</div>
    </div>`;
  }).join('') || `<div class="empty"><div class="ei">🕘</div><p>没有匹配的历史记录</p></div>`;
  document.getElementById('stats-label').textContent = `共 ${list.length} 条记录`;
  // 继续阅读横幅：搜索/筛选时隐藏
  document.getElementById('resume-banner').style.display = (query || curFilter) ? 'none' : 'flex';
}

/* ================= 视图切换 ================= */
const viewFav = document.getElementById('view-favorites');
const viewHis = document.getElementById('view-history');
const viewEmpty = document.getElementById('view-empty');

function applyTab(tab) {
  curTab = tab;
  viewFav.style.display = tab === 'favorites' ? 'block' : 'none';
  viewHis.style.display = tab === 'history' ? 'block' : 'none';
  viewEmpty.style.display = 'none';
  document.getElementById('page-title').textContent = tab === 'favorites' ? '我的收藏' : '阅读历史';
  document.getElementById('sort-label').textContent = tab === 'favorites' ? '最近添加' : '最近阅读';
  document.querySelectorAll('#lib-side .side-item[data-tab]').forEach(el =>
    el.classList.toggle('on', el.dataset.tab === tab));
  document.querySelectorAll('#tab-pill button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('#demo-bar button[data-v]').forEach(b =>
    b.classList.toggle('on', b.dataset.v === tab));
  tab === 'favorites' ? renderFavorites() : renderHistory();
}

function applyState(state) {
  if (state === 'favorites' || state === 'history') return applyTab(state);
  viewFav.style.display = viewHis.style.display = 'none';
  viewEmpty.style.display = 'flex';
  document.getElementById('stats-label').textContent = '';
  if (state === 'guest') {
    document.getElementById('empty-text').textContent = '登录后使用书架';
    document.getElementById('empty-sub').textContent = '收藏与阅读历史仅对登录用户可用';
    document.querySelector('.empty .ei').textContent = '🔒';
  } else {
    document.getElementById('empty-text').textContent = '书架还是空的';
    document.getElementById('empty-sub').textContent = '去首页逛逛，把喜欢的归档加入收藏吧';
    document.querySelector('.empty .ei').textContent = '🗂️';
  }
  document.querySelectorAll('#demo-bar button[data-v]').forEach(b =>
    b.classList.toggle('on', b.dataset.v === state));
}

/* 侧栏 Tab */
document.querySelectorAll('#lib-side .side-item[data-tab]').forEach(el =>
  el.addEventListener('click', () => applyTab(el.dataset.tab)));
/* Tab pill */
document.querySelectorAll('#tab-pill button').forEach(b =>
  b.addEventListener('click', () => applyTab(b.dataset.tab)));
/* demo-bar */
document.querySelectorAll('#demo-bar button').forEach(b =>
  b.addEventListener('click', () => applyState(b.dataset.v)));

/* 快捷筛选（可开关） */
document.querySelectorAll('#lib-side .side-item[data-filter]').forEach(el =>
  el.addEventListener('click', () => {
    const f = el.dataset.filter;
    curFilter = curFilter === f ? '' : f;
    document.querySelectorAll('#lib-side .side-item[data-filter]').forEach(x =>
      x.classList.toggle('on', x.dataset.filter === curFilter));
    curTab === 'favorites' ? renderFavorites() : renderHistory();
  }));

/* 搜索 */
document.getElementById('search-input').addEventListener('input', e => {
  query = e.target.value.trim();
  if (curTab === 'favorites') renderFavorites(); else renderHistory();
});

/* 刷新 */
document.getElementById('btn-refresh').addEventListener('click', function () {
  this.classList.add('spin');
  setTimeout(() => {
    curTab === 'favorites' ? renderFavorites() : renderHistory();
    this.classList.remove('spin');
  }, 450);
});

/* 主题切换 */
document.getElementById('btn-theme').addEventListener('click', () =>
  document.getElementById('window').classList.toggle('light'));

/* ================= 初始化 ================= */
document.getElementById('cnt-fav').textContent = favItems.length;
document.getElementById('cnt-his').textContent = hisItems.length;
applyTab('favorites');
</script>
</body>
</html>
