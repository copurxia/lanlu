<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanlu 在线源重设计 · 交互原型（浏览 / 筛选 / 下载）</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-elev: #16161a;
    --bg-card: #131316;
    --bg-capsule: rgba(22,22,26,.82);
    --border: rgba(255,255,255,.08);
    --text: #e8e8ea;
    --text-dim: #9a9aa2;
    --accent: #e8b04b;
    --accent-soft: rgba(232,176,75,.16);
    --danger: #e05d5d;
    --success: #4caf7d;
    --radius: 14px;
    --font: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html,body { height: 100%; }
  body { background: #333; font-family: var(--font);
         display: flex; align-items: center; justify-content: center; }
  button { font-family: inherit; color: var(--text); background: transparent; border: none; cursor: pointer; }

  #window {
    width: min(1320px, 96vw); height: min(860px, 94vh);
    color: var(--text);  /* 文字色必须在 #window 层解析，主题切换才会级联 */
    background: var(--bg); border-radius: 12px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    position: relative; display: flex; flex-direction: column;
  }

  /* ============ 顶栏（全局，与各 redesign 一致） ============ */
  #topbar {
    height: 56px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border);
    background: var(--bg-capsule); backdrop-filter: blur(18px); z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; }
  .brand-mark { width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #b0782a);
      display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .search-shell { flex: 0 1 460px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; color: var(--text-dim); font-size: 13px; cursor: text; transition: .15s; }
  .search-shell:focus-within, .search-shell:hover { border-color: rgba(232,176,75,.4); }
  .search-shell input { flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 13px; font-family: inherit; }
  .nav-pill { display: flex; background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px; gap: 2px; }
  .nav-pill button { padding: 6px 14px; font-size: 12.5px; border-radius: 999px; color: var(--text-dim); }
  .nav-pill button.on { background: var(--accent-soft); color: var(--accent); }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; display: inline-flex;
      align-items: center; justify-content: center; font-size: 16px;
      color: var(--text-dim); transition: .15s; flex: none; }
  .icon-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .icon-btn.active { color: var(--accent); background: var(--accent-soft); }
  .user-chip { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px;
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px;
      font-size: 12px; color: var(--text-dim); }
  .avatar { width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg,#4a6fa5,#2b3a55);
      display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }

  /* ============ 主区 ============ */
  #src-main { flex: 1; overflow-y: auto; padding: 18px 22px 48px; scroll-behavior: smooth; }

  /* 页头：标题 + 副标题 + 操作 */
  .src-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
  .src-head h2 { font-size: 20px; font-weight: 600; }
  .src-head .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .src-head .sp { flex: 1; }
  .btn-ghost { display: inline-flex; align-items: center; gap: 7px; font-size: 12px;
      padding: 7px 13px; border-radius: 9px; border: 1px solid var(--border);
      color: var(--text-dim); transition: .15s; }
  .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .btn-ghost.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(232,176,75,.4); }
  .btn-ghost.spin .r-ico { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-primary { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
      padding: 9px 18px; border-radius: 10px; background: var(--accent); color: #1a1206;
      font-weight: 600; transition: .15s; flex: none; }
  .btn-primary:hover { filter: brightness(1.08); }

  /* ============ 源选择 + 搜索行 ============ */
  .src-bar { display: flex; gap: 10px; margin-bottom: 12px; }
  .plugin-sel { display: flex; align-items: center; gap: 8px; background: var(--bg-elev);
      border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
      font-size: 12.5px; color: var(--text); cursor: pointer; transition: .15s; flex: none; }
  .plugin-sel:hover { border-color: rgba(232,176,75,.4); }
  .plugin-sel .pi { width: 20px; height: 20px; border-radius: 6px; flex: none;
      display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .plugin-sel .ns { font-size: 10.5px; color: var(--text-dim); }
  .src-bar .search-shell { flex: 1; margin: 0; }

  /* ============ 动态过滤器行（对齐插件 filter schema） ============ */
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .filter-row .fk { font-size: 11px; color: var(--text-dim); margin: 0 2px 0 6px; }
  .filter-row .fk:first-child { margin-left: 0; }
  .chip { font-size: 11.5px; padding: 5px 12px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--text-dim); transition: .13s; }
  .chip:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(232,176,75,.4); }
  .sel { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 9px;
      padding: 5px 10px; font-size: 11.5px; color: var(--text-dim);
      display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .sel:hover { border-color: rgba(232,176,75,.4); color: var(--text); }

  /* ============ 结果网格卡片 ============ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px 14px; animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
  .card { width: 100%; cursor: pointer; position: relative; }
  .card .cover { width: 100%; aspect-ratio: 3/4; border-radius: 12px; position: relative;
      overflow: hidden; border: 1px solid var(--border);
      transition: transform .18s ease, box-shadow .18s ease; }
  .card:hover .cover { transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(0,0,0,.5); outline: 1px solid rgba(232,176,75,.45); }
  .cover .ph { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 34px; opacity: .4; }
  .badge-type { background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px); font-size: 10.5px; padding: 3px 8px; border-radius: 6px;
      color: #f2f2f4;  /* 叠层语义：封面上的 chip 不随主题翻转 */
      display: flex; gap: 4px; align-items: center; }
  .badge-type.tank { color: var(--accent); }
  .cover .badge-type { position: absolute; top: 8px; left: 8px; }
  /* 远程标记：未下载到本地 */
  .badge-remote { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px); font-size: 10px; padding: 3px 8px; border-radius: 6px;
      color: #9ec9ff; display: flex; gap: 4px; align-items: center; }
  .badge-remote.local { color: var(--success); }
  /* 合集叠层效果 */
  .card.tank .stack { position: absolute; inset: 0; }
  .card.tank .stack::before, .card.tank .stack::after {
      content: ""; position: absolute; inset: 0; border-radius: 12px;
      background: linear-gradient(160deg,#22304a,#10151f); border: 1px solid var(--border); }
  .card.tank .stack::before { transform: translate(5px,-5px) scale(.96); z-index: -1; }
  /* 悬浮操作：下载 + 阅读 */
  .cover .acts { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px;
      display: flex; gap: 6px; opacity: 0; transition: .15s;
      background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  .card:hover .acts { opacity: 1; }
  .cover .acts button { flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 5px; font-size: 11px; padding: 6px 0; border-radius: 8px;
      background: rgba(255,255,255,.14); backdrop-filter: blur(6px); color: #fff; transition: .13s; }
  .cover .acts button:hover { background: var(--accent); color: #1a1206; }
  .cover .acts button.dl { background: var(--accent); color: #1a1206; font-weight: 600; }
  .cover .acts button.dl:hover { filter: brightness(1.1); }
  .card .t { margin-top: 8px; font-size: 12.5px; line-height: 1.4;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .m { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* 多选态 */
  #src-main.selecting .cover .acts { display: none; }
  .sel-check { position: absolute; top: 8px; right: 8px; z-index: 3; width: 24px; height: 24px;
      border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: rgba(0,0,0,.45);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center;
      font-size: 12px; color: #fff; transition: .13s; }
  #src-main.selecting .sel-check { display: flex; }
  #src-main.selecting .badge-remote { display: none; }
  .card.selected .sel-check { background: var(--accent); border-color: var(--accent); color: #1a1206; }
  .card.selected .cover { outline: 2px solid var(--accent); }

  /* ============ 分页 ============ */
  .feed-foot { display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 22px; }
  .stats { font-size: 12px; color: var(--text-dim); }
  .pager { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); }
  .pager button { min-width: 30px; padding: 6px 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 12px; }
  .pager button:hover { border-color: var(--accent); color: var(--accent); }
  .pager button.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(232,176,75,.4); }
  .pager button:disabled { opacity: .4; pointer-events: none; }

  /* 骨架屏 / 空态 */
  .skel { aspect-ratio: 3/4; border-radius: 12px; border: 1px solid var(--border);
      background: linear-gradient(100deg, var(--bg-card) 40%, var(--bg-elev) 50%, var(--bg-card) 60%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px 0; text-align: center; color: var(--text-dim); gap: 6px; }
  .empty .ei { font-size: 42px; opacity: .4; margin-bottom: 8px; }
  .empty p { font-size: 13px; }
  .empty .sub { font-size: 11.5px; opacity: .75; }

  /* ============ 多选工具条（底部悬浮，对齐 frontend selection toolbar） ============ */
  #selbar { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 80px);
      z-index: 40; display: flex; align-items: center; gap: 12px;
      background: var(--bg-capsule); backdrop-filter: blur(18px);
      border: 1px solid var(--border); border-radius: 999px; padding: 8px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.5); transition: transform .22s ease; }
  #selbar.show { transform: translate(-50%, 0); }
  #selbar .n { font-size: 12.5px; font-weight: 600; min-width: 52px; text-align: center; }
  #selbar .sep { width: 1px; height: 18px; background: var(--border); }
  #selbar button { font-size: 12px; color: var(--text-dim); padding: 6px 10px;
      border-radius: 8px; transition: .13s; }
  #selbar button:hover { background: rgba(255,255,255,.07); color: var(--text); }
  #selbar .btn-primary { padding: 7px 16px; font-size: 12px; }

  /* ============ 下载对话框 ============ */
  #dlg-mask { position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; }
  #dlg-mask.show { display: flex; }
  .dlg { width: min(420px, 90%); background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 30px 80px rgba(0,0,0,.6);
      animation: fadeUp .25s ease both; }
  .dlg .dh { padding: 18px 20px 0; }
  .dlg .dh h3 { font-size: 15.5px; font-weight: 600; }
  .dlg .dh p { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }
  .dlg .dh p b { color: var(--text); font-weight: 500; }
  .dlg .db { padding: 16px 20px 20px; }
  .dlg .fl { font-size: 12px; font-weight: 500; margin-bottom: 8px; }
  .cat-list { display: flex; flex-direction: column; gap: 6px; }
  .cat-opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px;
      color: var(--text-dim); cursor: pointer; transition: .13s; }
  .cat-opt:hover { border-color: rgba(255,255,255,.2); color: var(--text); }
  .cat-opt.on { border-color: rgba(232,176,75,.45); background: var(--accent-soft); color: var(--accent); }
  .cat-opt .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text-dim);
      flex: none; transition: .13s; }
  .cat-opt.on .dot { border-color: var(--accent); background: var(--accent);
      box-shadow: inset 0 0 0 2.5px var(--bg-card); }
  .cat-opt .cnt { margin-left: auto; font-size: 11px; opacity: .7; }
  .dlg .df { display: flex; justify-content: flex-end; gap: 10px; padding: 0 20px 18px; }

  /* Toast */
  #toast { position: absolute; top: 68px; left: 50%; transform: translate(-50%, -16px);
      z-index: 60; display: flex; align-items: center; gap: 8px; font-size: 12.5px;
      background: var(--bg-capsule); backdrop-filter: blur(18px); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 16px; box-shadow: 0 14px 40px rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast .ok { color: var(--success); }

  /* demo 工具条 */
  #demo-bar { position: fixed; top: 8px; left: 8px; z-index: 99; display: flex; gap: 6px;
      background: rgba(0,0,0,.7); border: 1px solid #444; border-radius: 10px; padding: 6px; }
  #demo-bar button { font-size: 11px; color: #ccc; padding: 5px 9px; border-radius: 7px;
      border: 1px solid #444; }
  #demo-bar button.on { background: var(--accent); color: #000; border-color: var(--accent); }

  /* ============ 窗口控制 ============ */
  .win-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; flex: none; }
  .win-controls { display: flex; gap: 2px; flex: none; }
  .win-btn { width: 38px; height: 30px; border-radius: 7px; font-size: 12px;
      color: var(--text-dim); display: inline-flex; align-items: center;
      justify-content: center; transition: .13s; }
  .win-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .win-btn.close:hover { background: #e81123; color: #fff; }
  #window.light .win-btn:hover { background: rgba(0,0,0,.07); }
  #window.light .win-btn.close:hover { background: #e81123; color: #fff; }

  /* ============ 明亮主题 ============ */
  #window.light {
    --bg: #f4f4f6; --bg-elev: #ffffff; --bg-card: #ffffff;
    --bg-capsule: rgba(255,255,255,.88);
    --border: rgba(0,0,0,.1); --text: #1d1d21; --text-dim: #6d6d76;
    --accent: #c78a1e; --accent-soft: rgba(199,138,30,.14);
  }
  #window.light .icon-btn:hover { background: rgba(0,0,0,.06); }
  #window.light .chip:hover { border-color: rgba(0,0,0,.25); }
  #window.light #selbar button:hover { background: rgba(0,0,0,.06); }
  #window.light .avatar { color: #fff; }
  #window.light .cat-opt.on .dot { box-shadow: inset 0 0 0 2.5px #fff; }
</style>
</head>
<body>

<div id="demo-bar">
  <span style="font-size:11px;color:#888;padding:5px 4px">在线源:</span>
  <button data-v="result" class="on">结果</button>
  <button data-v="loading">骨架</button>
  <button data-v="empty">空态</button>
  <button data-v="select">多选</button>
  <button data-v="dialog">下载弹窗</button>
</div>

<div id="window">
  <!-- 全局顶栏 -->
  <div id="topbar">
    <div class="brand"><div class="brand-mark">🦌</div><b>Lanlu</b></div>
    <div class="search-shell">
      <span>⌕</span>
      <input placeholder="搜索本地归档…">
    </div>
    <div class="nav-pill">
      <button>首页</button><button>书架</button><button class="on">来源</button>
    </div>
    <button class="icon-btn" title="设置">⚙</button>
    <button class="icon-btn" id="btn-theme" title="明暗切换">◐</button>
    <div class="user-chip"><div class="avatar">U</div>user</div>
    <div class="win-sep"></div>
    <div class="win-controls">
      <button class="win-btn" title="最小化">—</button>
      <button class="win-btn" title="最大化">▢</button>
      <button class="win-btn close" title="关闭">✕</button>
    </div>
  </div>

  <main id="src-main">
    <!-- 页头 -->
    <div class="src-head">
      <div>
        <h2>在线源</h2>
        <div class="sub">浏览在线归档源并一键下载到服务器</div>
      </div>
      <div class="sp"></div>
      <button class="btn-ghost" id="btn-multi">☑ 多选</button>
      <button class="btn-ghost" id="btn-refresh"><span class="r-ico">⟳</span>刷新</button>
    </div>

    <!-- 源选择 + 搜索 -->
    <div class="src-bar">
      <div class="plugin-sel" id="plugin-sel">
        <span class="pi" style="background:linear-gradient(135deg,#3a6ea5,#23406b);color:#fff">E</span>
        <span id="plugin-name">EHentai</span>
        <span class="ns">ehentai</span>
        <span style="color:var(--text-dim);font-size:10px">▾</span>
      </div>
      <div class="search-shell">
        <span>⌕</span>
        <input id="src-search" placeholder="搜索在线归档… 回车确认">
      </div>
      <button class="btn-primary" id="btn-search">⌕ 搜索</button>
    </div>

    <!-- 动态过滤器（由插件 schema 驱动） -->
    <div class="filter-row" id="filter-row">
      <span class="fk">分类</span>
      <button class="chip on">全部</button>
      <button class="chip">同人誌</button>
      <button class="chip">漫画</button>
      <button class="chip">画集</button>
      <button class="chip">Cosplay</button>
      <span class="fk">语言</span>
      <button class="chip on">全部</button>
      <button class="chip">中文</button>
      <button class="chip">日文</button>
      <button class="chip">英文</button>
      <span class="fk">排序</span>
      <div class="sel">⇅ 最新发布 ▾</div>
      <span class="fk">评分</span>
      <button class="chip">★ 4+</button>
      <button class="chip">仅含页数 ≥ 20</button>
    </div>

    <!-- 结果区 -->
    <div id="result-wrap">
      <div class="grid" id="src-grid"></div>
      <div class="feed-foot" id="src-foot">
        <span class="stats" id="src-stats"></span>
        <div class="pager">
          <button id="pg-prev">‹ 上一页</button>
          <button class="on">1</button><button>2</button><button>3</button>
          <button id="pg-next">下一页 ›</button>
        </div>
      </div>
    </div>

    <!-- 空态 -->
    <div class="empty" id="src-empty" style="display:none">
      <div class="ei">🌐</div>
      <p id="src-empty-text">请选择在线源插件并搜索</p>
      <p class="sub" id="src-empty-sub">在左上角切换源，输入关键词或直接浏览首页</p>
    </div>
  </main>

  <!-- 多选工具条 -->
  <div id="selbar">
    <span class="n" id="sel-count">已选 0</span>
    <div class="sep"></div>
    <button id="sel-all">全选</button>
    <button class="btn-primary" id="sel-download">⬇ 批量下载</button>
    <div class="sep"></div>
    <button id="sel-cancel">✕ 取消</button>
  </div>

  <!-- 下载对话框 -->
  <div id="dlg-mask">
    <div class="dlg">
      <div class="dh">
        <h3 id="dlg-title">选择目标分类</h3>
        <p>将 <b id="dlg-item">归档</b> 下载到本地</p>
      </div>
      <div class="db">
        <div class="fl">目标分类</div>
        <div class="cat-list" id="cat-list">
          <div class="cat-opt on"><span class="dot"></span>默认<span class="cnt">128 项</span></div>
          <div class="cat-opt"><span class="dot"></span>同人誌<span class="cnt">64 项</span></div>
          <div class="cat-opt"><span class="dot"></span>画集<span class="cnt">23 项</span></div>
          <div class="cat-opt"><span class="dot"></span>待整理<span class="cnt">7 项</span></div>
        </div>
      </div>
      <div class="df">
        <button class="btn-ghost" id="dlg-cancel">取消</button>
        <button class="btn-primary" id="dlg-confirm">⬇ 确认下载</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"><span class="ok">✓</span><span id="toast-text">下载任务已创建</span></div>
</div>

<script>
/* ================= demo 数据 ================= */
const TITLES = [
  '[C104] 夏日终焉的海边物语', '(COMIC1☆25) 放课后天文部活动记录',
  '[Demo Artist] 午后图书馆的秘密集会', '星空下的约定 总集篇',
  '[Fanbox] 魔女宅急便 番外篇', '深夜食堂的猫又小姐',
  '[画集] 四季彩 – 春', '机械少女与旧书店',
  '[DLsite] 勇者辞职之后的慢生活', '[再録] 时间停止便利屋',
  '月见之丘的狐狸嫁娶', '[新刊] 放学后的炼金工房',
  '[COMITIA152] 铁道少女漫游记录', '猫咪咖啡馆营业中',
  '[总集编] 青春速写 2019-2024', '海边的移动书屋',
  '[C105 新刊预约] 雪国列车终点站', '[Web再録] 天台上的天文部'
];
const HUES = [14, 36, 52, 200, 222, 264, 320, 160, 96, 280];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function makeItem(i) {
  const tank = Math.random() < .25;
  return {
    id: 'r' + i,
    title: pick(TITLES),
    kind: tank ? 'tank' : 'arc',
    pages: tank ? rnd(3, 9) : rnd(40, 260),   // tank 时展示子档案数
    hue: pick(HUES),
    local: Math.random() < .15,                // 已下载到本地
  };
}
const items = Array.from({ length: 18 }, (_, i) => makeItem(i));

/* ================= 渲染 ================= */
const main = document.getElementById('src-main');
const grid = document.getElementById('src-grid');
const foot = document.getElementById('src-foot');
const wrap = document.getElementById('result-wrap');
const emptyEl = document.getElementById('src-empty');
let selecting = false;
const selected = new Set();

function coverBg(it) {
  return `background:linear-gradient(155deg,hsl(${it.hue},32%,26%),hsl(${(it.hue + 30) % 360},28%,14%))`;
}

function cardHTML(it) {
  const meta = it.kind === 'tank' ? `${it.pages} 档案` : `${it.pages} 页`;
  return `
  <div class="card ${it.kind === 'tank' ? 'tank' : ''}" data-id="${it.id}">
    <div class="cover" style="${coverBg(it)}">
      ${it.kind === 'tank' ? '<div class="stack"></div>' : ''}
      <div class="ph">${it.kind === 'tank' ? '📚' : '🖼️'}</div>
      ${it.kind === 'tank' ? '<span class="badge-type tank">📚 合集</span>' : ''}
      <span class="badge-remote ${it.local ? 'local' : ''}">${it.local ? '✓ 已下载' : '☁ 远程'}</span>
      <span class="sel-check">✓</span>
      <div class="acts">
        <button data-act="read">▶ 阅读</button>
        <button data-act="detail">详情</button>
        <button class="dl" data-act="dl">⬇ 下载</button>
      </div>
    </div>
    <div class="t">${it.title}</div>
    <div class="m">${meta} · ehentai</div>
  </div>`;
}

function renderGrid() {
  grid.innerHTML = items.map(cardHTML).join('');
  document.getElementById('src-stats').textContent = `第 1 页 · 本页 ${items.length} 项 · 来源 ehentai`;
  syncSelected();
}
function renderSkeleton() {
  grid.innerHTML = Array.from({ length: 12 }, () => '<div class="skel"></div>').join('');
  document.getElementById('src-stats').textContent = '加载中…';
}
function syncSelected() {
  grid.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('selected', selected.has(c.dataset.id)));
  document.getElementById('sel-count').textContent = `已选 ${selected.size}`;
}

/* ================= 视图状态 ================= */
function applyState(v) {
  document.querySelectorAll('#demo-bar button[data-v]').forEach(b =>
    b.classList.toggle('on', b.dataset.v === v));
  if (v === 'empty') {
    wrap.style.display = 'none';
    emptyEl.style.display = 'flex';
    document.getElementById('src-empty-text').textContent = '没有找到结果';
    document.getElementById('src-empty-sub').textContent = '换个关键词或调整筛选条件试试';
    return;
  }
  wrap.style.display = 'block';
  emptyEl.style.display = 'none';
  if (v === 'loading') renderSkeleton();
  else if (v === 'select') { renderGrid(); enterSelect(); }
  else if (v === 'dialog') { renderGrid(); openDialog(items[0].title); }
  else renderGrid();
}
document.querySelectorAll('#demo-bar button').forEach(b =>
  b.addEventListener('click', () => applyState(b.dataset.v)));

/* ================= 多选 ================= */
const selbar = document.getElementById('selbar');
function enterSelect() {
  selecting = true;
  selected.clear();
  main.classList.add('selecting');
  selbar.classList.add('show');
  document.getElementById('btn-multi').classList.add('on');
  syncSelected();
}
function exitSelect() {
  selecting = false;
  selected.clear();
  main.classList.remove('selecting');
  selbar.classList.remove('show');
  document.getElementById('btn-multi').classList.remove('on');
  syncSelected();
}
document.getElementById('btn-multi').addEventListener('click', () =>
  selecting ? exitSelect() : enterSelect());
document.getElementById('sel-cancel').addEventListener('click', exitSelect);
document.getElementById('sel-all').addEventListener('click', () => {
  items.forEach(it => selected.add(it.id));
  syncSelected();
});
document.getElementById('sel-download').addEventListener('click', () => {
  if (!selected.size) return;
  openDialog(`已选 ${selected.size} 项`);
});

/* 卡片点击：多选态切换选中；操作按钮走各自行为 */
grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const actBtn = e.target.closest('[data-act]');
  const it = items.find(x => x.id === card.dataset.id);
  if (selecting) {
    selected.has(it.id) ? selected.delete(it.id) : selected.add(it.id);
    syncSelected();
    return;
  }
  if (actBtn?.dataset.act === 'dl') openDialog(it.title);
  else if (actBtn?.dataset.act === 'read') toast('打开阅读器（demo）');
  else if (actBtn?.dataset.act === 'detail') toast('打开详情页（demo）');
});

/* ================= 下载对话框 ================= */
const dlgMask = document.getElementById('dlg-mask');
function openDialog(name) {
  document.getElementById('dlg-item').textContent = name;
  dlgMask.classList.add('show');
}
function closeDialog() { dlgMask.classList.remove('show'); }
document.getElementById('dlg-cancel').addEventListener('click', closeDialog);
dlgMask.addEventListener('click', e => { if (e.target === dlgMask) closeDialog(); });
document.getElementById('cat-list').addEventListener('click', e => {
  const opt = e.target.closest('.cat-opt');
  if (!opt) return;
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('on'));
  opt.classList.add('on');
});
document.getElementById('dlg-confirm').addEventListener('click', () => {
  closeDialog();
  if (selecting) exitSelect();
  toast('下载任务已创建');
});

/* ================= Toast ================= */
let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ================= 过滤器 chips（单选组 demo） ================= */
document.getElementById('filter-row').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  // 同一 fk 标签后的 chip 视为一组：清除同组 on
  const row = chip.parentElement;
  const group = [];
  let node = chip.previousElementSibling;
  while (node && !node.classList.contains('fk')) { group.push(node); node = node.previousElementSibling; }
  node = chip.nextElementSibling;
  while (node && !node.classList.contains('fk') && !node.classList.contains('sel')) { group.push(node); node = node.nextElementSibling; }
  group.forEach(c => c.classList && c.classList.remove('on'));
  chip.classList.add('on');
});

/* 搜索 / 刷新（demo 行为） */
document.getElementById('btn-search').addEventListener('click', () => {
  renderSkeleton();
  setTimeout(renderGrid, 600);
});
document.getElementById('src-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-search').click();
});
document.getElementById('btn-refresh').addEventListener('click', function () {
  this.classList.add('spin');
  renderSkeleton();
  setTimeout(() => { renderGrid(); this.classList.remove('spin'); }, 600);
});

/* 主题切换 */
document.getElementById('btn-theme').addEventListener('click', () =>
  document.getElementById('window').classList.toggle('light'));

/* ================= 初始化 ================= */
renderGrid();
</script>
</body>
</html>
