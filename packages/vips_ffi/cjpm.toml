[package]
  cjc-version = "1.1.0"
  name = "vips_ffi"
  description = "Minimal libvips FFI bindings (thumbnail/resize/crop/write)"
  version = "0.1.0"
  output-type = "static"
  # Use pkg-config --libs vips as reference.
  link-option = "-lvips -lgio-2.0 -lgobject-2.0 -lglib-2.0"

[dependencies]


[target.aarch64-linux-ohos]
compile-option = "--sysroot=${OHOS_SYSROOT} -B${OHOS_SYSROOT}/usr/lib/aarch64-linux-ohos"
link-option = "-L ${OHOS_SYSROOT}/usr/lib/aarch64-linux-ohos"
