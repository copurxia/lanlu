[package]
name = "lanlu-lgpu-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "L 层渲染器：wgpu 后端，导出 C ABI 给 Cangjie 使用（对标 Chromium ozone 的渲染部分）"

[lib]
name = "lgpu_native"
crate-type = ["staticlib", "rlib"]

# 只取 vulkan：OHOS 的呈现路径是 VK_OHOS_surface，不需要 dx12/metal/gles。
[dependencies]
# 字形光栅化：ab_glyph 输出抗锯齿覆盖率位图（离线缓存有）
ab_glyph = "=0.2.32"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
# wgpu 30 的 enumerate_adapters/request_adapter 是 async：这个 crate 只做同步 FFI，
# 用最小执行器把它们 block_on 掉（不引 tokio）。
pollster = "=0.4.0"
# 构造 RawWindowHandle::OhosNdk（XComponent 的 OHNativeWindow*）交给 wgpu-hal。
raw-window-handle = "=0.6.2"
# 顶点/实例缓冲的 POD 转换（wgpu 要求 BufferAddress 对齐的字节视图）
bytemuck = { version = "=1.25.2", features = ["derive"] }

# 上游 wgpu-hal 不支持 OHOS surface，这里用 horizon-ohos 打过补丁的 30.0.1
# （src/vulkan/instance.rs 的 create_surface_ohos / VK_OHOS_surface）。
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }

[profile.release]
opt-level = 2
panic = "abort"
