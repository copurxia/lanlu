# LWP 协议 IDL —— input 接口族（计划 §6：指针/滚轮/键盘/文本输入）
#
# 设计对齐 winit/wayland：指针事件带"处于哪个 surface"的语义由 shell 保证；
# 高频 motion 标记 DROPPABLE，由发送端（壳）限流，接收端可丢。

[interface.lw_input]
id = 2
version = 1
doc = "输入事件：指针、滚轮、键盘、文本输入。全部由壳 -> 引擎（event 方向）。"

[[interface.lw_input.event]]
name = "pointer_motion"
since = 1
doc = "指针移动。x/y 为 surface 逻辑坐标（物理像素 / 缩放比）。"
args = [
  { name = "x", type = "f32" },
  { name = "y", type = "f32" },
]
# flags 由发送方加 LWP_F_DROPPABLE

[[interface.lw_input.event]]
name = "pointer_button"
since = 1
doc = "按键按下/释放。button 取值对齐 winit：0=左 1=右 2=中。"
args = [
  { name = "x", type = "f32" },
  { name = "y", type = "f32" },
  { name = "button", type = "u8" },
  { name = "down", type = "bool" },
]

[[interface.lw_input.event]]
name = "pointer_axis"
since = 1
doc = "滚轮/触摸板滚动。dx/dy 为逻辑行数；wayland 轴向取反后传入（计划 §6.3）。"
args = [
  { name = "dx", type = "f32" },
  { name = "dy", type = "f32" },
]

[[interface.lw_input.event]]
name = "key"
since = 1
doc = """键盘原始事件。keycode 为壳侧单表键码（计划 §6.1：evdev 布局，OHOS keyCode 由壳映射）；
down 区分按下/释放。

since=2 追加两个字段（只追加，不改老字段布局）：
  utf8      —— 该键在当前键盘布局/修饰键下产生的文本（可为空）。输入法不消费的可打印键
               （数字、符号、以及没有输入法时的字母）靠它进入输入框，不再由引擎猜字符。
  modifiers —— 修饰键位掩码，见 LWP_KEY_MOD_*（对齐 SDL_KMOD_*，引擎 KeyModifiers 直接复用）。

去重约定：壳不得把输入法已消费的按键再发到这里；引擎在输入框聚焦且 utf8 非空、
且没有 Ctrl/Alt/Meta 时插入该文本（见 docs/lwindow-ime-plan.md §3）。"""
args = [
  { name = "keycode", type = "u32" },
  { name = "down", type = "bool" },
  { name = "utf8", type = "string" },
  { name = "modifiers", type = "u16" },
]

[[interface.lw_input.event]]
name = "text_input"
since = 1
doc = "IME 提交的文本（对应 wayland text-input-v3 commit）。"
args = [
  { name = "text", type = "string" },
]

# 修饰键位掩码（与 SDL_KMOD_* 同值，引擎 KeyModifiers 直接复用，零转换）。
[bitfield.key_modifiers]
extensible = true
doc = "lw_input.key 的 modifiers 字段。位定义对齐 SDL_KMOD_*（lgui.input.KeyModifiers 的输入格式）。"
entries = [
  ["lshift", 1],
  ["rshift", 2],
  ["level5", 4],
  ["lctrl", 64],
  ["rctrl", 128],
  ["lalt", 256],
  ["ralt", 512],
  ["lgui", 1024],
  ["rgui", 2048],
  ["num", 4096],
  ["caps", 8192],
  ["mode", 16384],
  ["scroll", 32768],
]
