[package]
  cjc-version = "1.2.0"
  name = "qwest"
  description = "Reqwest-style HTTP/1.1 client for Cangjie: pooled connections, streaming bodies, native timeouts"
  version = "0.1.0"
  target-dir = ""
  src-dir = "src"
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]

# stdx（net.tls / encoding.url）以二进制依赖方式引入，与 client-next/服务端 cjpm.toml 同款。
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = [ "${CANGJIE_STDX_PATH}" ]

[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = [ "${CANGJIE_STDX_PATH}" ]

[target.aarch64-linux-ohos]
compile-option = "--sysroot=/workspace/horizon-ohos/.tooling/sdk26/clt/command-line-tools/sdk/default/openharmony/native/sysroot -B/workspace/horizon-ohos/.tooling/sdk26/clt/command-line-tools/sdk/default/openharmony/native/sysroot/usr/lib/aarch64-linux-ohos"
link-option = "-L /workspace/horizon-ohos/.tooling/sdk26/clt/command-line-tools/sdk/default/openharmony/native/sysroot/usr/lib/aarch64-linux-ohos"
  [target.aarch64-linux-ohos.bin-dependencies]
    path-option = [ "/workspace/.cjv/stdx/sts-1.2.0-linux-x64-ohos/static/stdx" ]
