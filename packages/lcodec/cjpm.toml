[package]
cjc-version = "1.2.0"
name = "lcodec"
version = "0.1.0"
description = "Lanlu 解码统合层：图片解码/缩放/圆角/模糊 + 字幕/媒体出口的跨平台 API；图片后端运行时装载，业务层零链接依赖。"
output-type = "static"

[dependencies]

# 图片：本包**不依赖 vips_ffi、也不声明 -lvips**。
# 解码后端在运行时 dlopen（见 src/vips_bind.cj）：
#   - 桌面：系统 libvips.so(.42/.43/.44) / libvips.dylib / libvips-42.dll
#   - 设备：不用 vips，直连系统 ImageSource（libimage_source/libpixelmap，随系统）
# 这样 client-next 的链接行里不会再有 vips，缺库时报运行时错误而不是链接失败。

# stdx（encoding.base64，单测用）以二进制依赖方式引入，与 client-next/qwest 同款。
[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = [ "${CANGJIE_STDX_PATH}" ]

[target.x86_64-w64-mingw32]
  [target.x86_64-w64-mingw32.bin-dependencies]
    path-option = [ "${CANGJIE_STDX_PATH}" ]

[target.aarch64-linux-ohos]
compile-option = "--sysroot=${OHOS_SYSROOT} -B${OHOS_SYSROOT}/usr/lib/aarch64-linux-ohos"
link-option = "-L ${OHOS_SYSROOT}/usr/lib/aarch64-linux-ohos"
  [target.aarch64-linux-ohos.bin-dependencies]
    path-option = [ "${OHOS_STDX}/stdx" ]
