[package]
  cjc-version = "1.0.5"
  name = "sdl_stub_ffi"
  description = "本机 cui 单测的 SDL3/TTF 桩声明：link-option 透传给测试可执行文件（与 vips_ffi 同机制）。桩库本体由 tools/verify-cui-interactions.sh 生成并经 LIBRARY_PATH 注入，本包不含任何代码。"
  version = "0.1.0"
  output-type = "static"
  # 这两个 -l 只在宿主（x86_64-unknown-linux-gnu）测试链接时用；桩库目录由验证脚本提供。
  link-option = "-lSDL3 -lSDL3_ttf"

[dependencies]

[target.aarch64-linux-ohos]
# OHOS 构建不引用本包；即便被误引入，link-option 仅声明不产生代码。
compile-option = "--sysroot=${OHOS_SYSROOT} -B${OHOS_SYSROOT}/usr/lib/aarch64-linux-ohos"
link-option = ""
