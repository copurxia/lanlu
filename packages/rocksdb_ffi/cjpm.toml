[package]
  cjc-version = "1.1.0"
  name = "rocksdb_ffi"
  description = "Minimal RocksDB C API bindings"
  version = "0.1.0"
  output-type = "static"

[dependencies]

[ffi.c]
lanlu_rocksdb_bridge = { path = "./native" }

[target.x86_64-unknown-linux-gnu]
link-option = "-L ./native -llanlu_rocksdb_bridge -lrocksdb"

[target.x86_64-w64-mingw32]
link-option = "-L ./native -llanlu_rocksdb_bridge -lrocksdb"
