[package]
cjc-version = "1.0.5"
name = "lwindow"
version = "0.1.0"
output-type = "static"
description = "Lanlu 平台适配层（对标 Chromium ui/ozone）：进程环境/路径/字体/窗口动作/对话框/输入 的平台差异全部收敛于此，业务层与 cui 只见跨平台 API。"

[dependencies]
# P6 拆包：displays/剪贴板后端接口已迁至 lbase（displays 移入本包 src/displays），
# 平台抽象层不再依赖 SDL 绑定包（计划 §4.5 目标态）。
lbase = { path = "../lbase" }
lwp = { path = "../lwp" }
# backend.lwp（计划 §4.5）：壳 surface → 渲染画布的翻译层，生产路径唯一 lgpu 消费方
#（portcheck 自检探针按 tools/deps-rules.toml 白名单直连 lgpu，不属业务/平台路径）。
lgpu = { path = "../lgpu" }

# 宿主单测链接：静态依赖包的 link-option 不向上传递（同 lgui/cjpm.toml 的做法）。
# LWP_LIB_DIR 指向 liblwp_native.so；LGUI_SDL_LIB_DIR 指向宿主 SDL3（CI 用
# packages/cangjie-gui/sdl/.sdl3，本机可用 stub 目录）。
[target.x86_64-unknown-linux-gnu]
link-option = "-L ${LWP_LIB_DIR} -L ${LGUI_SDL_LIB_DIR} -L ${LGPU_LIB_DIR} -llwp_native -lSDL3 -lSDL3_ttf -llgpu_native -lvlc -lrocksdb -lstdc++ -lfontconfig -lfreetype -ldl -lpthread"
