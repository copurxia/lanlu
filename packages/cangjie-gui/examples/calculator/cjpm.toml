[package]
cjc-version = "1.0.5"
name = "cui_calculator"
version = "0.1.0"
output-type = "dynamic"
description = "CUI calculator example."

[dependencies]
cui = { path = "../.." }

[target.aarch64-linux-ohos]
compile-option = "--sysroot=/workspace/horizon-ohos/.tooling/sdk26/clt/command-line-tools/sdk/default/openharmony/native/sysroot -B/workspace/horizon-ohos/.tooling/sdk26/clt/command-line-tools/sdk/default/openharmony/native/sysroot/usr/lib/aarch64-linux-ohos"
link-option = "-L /workspace/lanlu/.research-ohos/ohos-stubs -L /workspace/lanlu/.research-ohos/sdl3-ohos/prefix-single/lib -L /workspace/horizon-ohos/.tooling/sdk26/clt/command-line-tools/sdk/default/openharmony/native/sysroot/usr/lib/aarch64-linux-ohos -lSDL3 -lSDL3_ttf"

[package.metadata.ohos]
app-name = "CUICalc"
bundle-name = "com.example.cuicalc"
version-code = 1000000
api-level = 26
device-types = ["2in1", "phone"]
module-name = "entry"
shim-module = "cui_calculator"
entry-ability = "EntryAbility"
page = "pages/Index"
ui = "sdl3"
