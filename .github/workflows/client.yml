name: Client CI

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:
  schedule:
    # Daily 20:30 UTC (~04:30 Beijing) nightly build, matching the Gitea pipeline.
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          set -eux
          cd client
          npm ci --no-audit --no-fund

      - name: Typecheck
        run: |
          set -eux
          cd client
          npx tsc --noEmit

      - name: Unit tests
        run: |
          set -eux
          cd client
          npm test -- --runInBand

      # The client still carries a pre-existing lint baseline (unused symbols and
      # react-hooks/exhaustive-deps). Keep it visible but non-blocking until the
      # baseline is cleaned up, then remove continue-on-error.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          set -eux
          cd client
          npm run lint

  android-release:
    name: Nightly release APK
    # Schedule / manual dispatch only: plain pushes run quality alone so every
    # commit does not burn a release build (same policy as the Gitea pipeline).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          set -eux
          cd client
          npm ci --no-audit --no-fund

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/android/**/*.gradle*', 'client/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true"
        run: |
          set -eux
          cd client/android
          chmod +x gradlew
          # Nightly builds must advance versionCode (yymmddnn) or Android
          # refuses to install them over the previous nightly.
          code="$(( $(date -u +%y%m%d) * 100 + 3 ))"
          echo "$code" > version-code.txt
          echo "github nightly versionCode=$code"
          ./gradlew assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.internal.http.socketTimeout=180000 \
            -Dorg.gradle.internal.http.connectionTimeout=60000

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-android-release
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Rename the APK before upload so the release asset keeps the stable
      # nightly name (action-gh-release v2 has no asset_name input; it uploads
      # files under their on-disk name and overwrites same-named assets).
      - name: Rename APK for release asset
        run: |
          set -eux
          cp client/android/app/build/outputs/apk/release/app-release.apk \
             /tmp/lanlu-client-nightly.apk

      - name: Publish to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          fail_on_unmatched_files: true
          files: /tmp/lanlu-client-nightly.apk
          body: Android nightly build for commit ${GITHUB_SHA::7}. Install over a previous nightly; signing key is stable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
