name: Client Next CI

on:
  push:
    paths:
      - "apps/desktop/**"
      - "packages/lbase/**"
      - "packages/lcodec/**"
      - "packages/lgpu/**"
      - "packages/lplatform-ohos/**"
      - "packages/lplatform-wayland/**"
      - "packages/lpack-ohos/**"
      - "packages/lwindow/**"
      - "packages/lwp/**"
      - "packages/portcheck/**"
      - "packages/sdl_stub_ffi/**"
      - "packages/vips_ffi/**"
      - "packages/libvlc_ffi/**"
      - "packages/libavformat_ffi/**"
      - "packages/libass_ffi/**"
      - "packages/fontkit_ffi/**"
      - "packages/webview/**"
      - "packages/rocksdb_ffi/**"
      - "packages/qwest/**"
      - "tools/**"
      - "toolchain/**"
      - "justfile"
      - ".github/workflows/client-next.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/lbase/**"
      - "packages/lcodec/**"
      - "packages/lgpu/**"
      - "packages/lplatform-ohos/**"
      - "packages/lplatform-wayland/**"
      - "packages/lpack-ohos/**"
      - "packages/lwindow/**"
      - "packages/lwp/**"
      - "packages/portcheck/**"
      - "packages/sdl_stub_ffi/**"
      - "packages/vips_ffi/**"
      - "packages/libvlc_ffi/**"
      - "packages/libavformat_ffi/**"
      - "packages/libass_ffi/**"
      - "packages/fontkit_ffi/**"
      - "packages/webview/**"
      - "packages/rocksdb_ffi/**"
      - "packages/qwest/**"
      - "tools/**"
      - "toolchain/**"
      - "justfile"
      - ".github/workflows/client-next.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-next-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env: {}

jobs:
  guards:
    name: Layering guards (deps + platform isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # 两个自测脚本的 mktemp 默认已改为“仓库同级 tmp/”，不再写死 Gitea 自托管 runner
      # 的 /workspace/lanlu/tmp；这里再显式给一次，避免继承到不可写目录。
      TMPDIR: ${{ runner.temp }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host build tools
        # Platform package selftest 用 c++ 编壳侧 LWP 客户端，lwp/native/build.sh 用 cc；
        # liblwp 导出比对用 nm（binutils）。Gitea 的 guards 跑在完整镜像上因而自带这些，
        # GitHub 的 ubuntu-24.04 runner 没有 c++ 驱动（run 44873527549 step 10 失败）。
        # 依赖是按脚本核对的：run-tests.sh 只需 c++，lwp/test.sh 需 cc + python3。
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils pkg-config ca-certificates
          cc --version
          c++ --version

      - name: xtask doctor
        run: python3 -m tools.xtask doctor --json

      - name: xtask self-tests
        run: python3 -m tools.xtask test --package xtask

      # T0 静态门禁（计划 docs/lwindow-platform-separation-plan.md §4.5 / §16.2）
      # 违规集合记在 tools/quality-baseline.toml，只允许下降；新增即失败。
      - name: Dependency whitelist
        run: python3 tools/check-deps.py

      - name: Platform isolation
        run: python3 tools/check-platform-isolation.py

      # LWP 生成物必须与 IDL 一致（计划 §5.1：生成物入库，CI 校验无 diff）
      - name: LWP generated artifacts are up to date
        run: python3 tools/lwp-gen.py --check

      # 协议只允许追加（计划 §5.1）：删字段/改类型必须 protocol_major + 1
      - name: LWP ABI is backward compatible
        run: python3 tools/lwp-gen.py --check-abi

      # 平台包自测：壳侧 LWP 发送端的字节级契约（协议模式 + 回落模式）
      - name: Platform package selftest (shell LWP client)
        run: bash packages/lplatform-ohos/selftest/run-tests.sh

      - name: LWP tests (C side + generated artifacts)
        run: bash packages/lwp/test.sh

      # 壳/引擎都依赖 liblwp.so；导出符号必须恰好是公开 API（计划 §5.2 符号门禁）
      - name: liblwp.so exports only the public API
        run: |
          set -euo pipefail
          bash packages/lwp/native/build.sh
          got=$(nm -D --defined-only packages/lwp/lib/liblwp_native.so | awk '{print $3}' | sort | tr '\n' ' ')
          # 期望值从 liblwp.map 解析，不再抄一份清单：手抄的那份已经漂移过
          # （缺 lwp_stats_summary / lwp_trace_replay，Gitea guards 已改为此写法）。
          want=$(sed -n '/global:/,/local:/p' packages/lwp/native/liblwp.map | grep -o 'lwp_[a-z_]*' | sort | tr '\n' ' ')
          [ -n "$want" ] || { echo "liblwp.map 未解析出任何导出符号"; exit 1; }
          if [ "$got" != "$want" ]; then
            echo "导出符号不符："; echo "  实际: $got"; echo "  期望: $want"; exit 1
          fi
          echo "[PASS] liblwp_native.so 导出符号与 liblwp.map 一致（$(echo "$want" | wc -w) 个）"

      - name: Legacy layering / SDL guards
        run: |
          set -euo pipefail
          bash tools/check-layering.sh
          bash tools/check-no-sdl.sh
          # 文件桥只允许减少（计划 §11 / M6 删除进度）
          bash tools/check-no-file-bridge.sh
          # 文档里的数字/链接必须与仓库真实状态一致（防止文档漂移）
          python3 tools/check-docs-consistency.py
          # OHOS 打包环境自检（工具链缺失时跳过，不阻塞无关改动）
          if [ -d /workspace/.cjv/toolchains ] || [ -n "${CANGJIE_HOME:-}" ]; then
            bash packages/lpack-ohos/tools/build-ohos.sh --self-check
          else
            echo "[skip] 无仓颉工具链，跳过 lpack-ohos 自检"
          fi
          # Wayland 壳（M1W）：协议编解码单测 + 编译
          if command -v cargo >/dev/null 2>&1; then
            (cd packages/lplatform-wayland && cargo test --quiet)
          else
            echo "[skip] 无 cargo，跳过 lplatform-wayland"
          fi

      - name: Guard reports
        if: always()
        run: |
          {
            echo "### Layering guards"
            echo
            echo '```'
            python3 tools/check-deps.py --report || true
            python3 tools/check-platform-isolation.py --report || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
  quality:
    name: Quality report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install quality tooling
        # cjlint 的 JSON 结果用 jq 统计；ubuntu-24.04 镜像自带 jq，这里显式装上以消除隐式依赖。
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq

      - name: Set up Cangjie 1.2.0
        # 与 build-test / windows-build 及 toolchain/versions.toml 的 desktop 版本统一；
        # 本 job 只跑 advisory 的 cjfmt/cjlint，升级不改变门禁强度。
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.2.0

      - name: Show tool versions
        run: |
          set -euo pipefail
          cjc -v
          cjfmt -v
          cjlint -v

      # client-next has pre-existing formatting differences. Keep this advisory until
      # the baseline is formatted, then remove continue-on-error to make it a gate.
      - name: Check formatting (advisory)
        continue-on-error: true
        run: |
          set -euo pipefail
          format_root="${RUNNER_TEMP}/client-next-format"
          report="apps/desktop/reports/cjfmt.diff"
          mkdir -p "${format_root}/src" apps/desktop/reports
          cp -a apps/desktop/src/. "${format_root}/src/"
          cp -a apps/desktop/build.cj "${format_root}/build.cj"

          cjfmt -d "${format_root}" -c apps/desktop/cangjie-format.toml

          format_clean=true
          diff -ru apps/desktop/src "${format_root}/src" > "${report}" || format_clean=false
          diff -u apps/desktop/build.cj "${format_root}/build.cj" >> "${report}" || format_clean=false
          if [ "${format_clean}" != true ]; then
            echo "::warning::client-next contains files that cjfmt would change; see the quality report artifact."
            exit 1
          fi

      - name: Run cjlint
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/reports
          cjlint -f apps/desktop/src -r json -o apps/desktop/reports/cjlint
          test -s apps/desktop/reports/cjlint.json
          issue_count="$(jq 'length' apps/desktop/reports/cjlint.json)"
          {
            echo "### client-next cjlint"
            echo
            echo "Reported issues: ${issue_count} (report-only baseline)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-next-quality-${{ github.sha }}
          path: apps/desktop/reports/
          if-no-files-found: warn
          retention-days: 14

  build-test:
    name: Build, test and headless smoke test
    # 与 Gitea `client-next-test`（run 1511：261/261 PASSED，13m03s）同一份已验证配方。
    # 旧版把 SDL3 期待为仓库内 packages/cangjie-gui/sdl/.sdl3，但该路径在树里一个文件
    # 都没有（git ls-tree 计数 0），run 44873527549 因此死在第 3 步；26.04 才有
    # libsdl3-dev / libsdl3-ttf-dev，soname 3.4.2 / 3.2.2 与原先期望一致。
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    env:
      LGUI_SDL_LIB_DIR: /usr/lib/x86_64-linux-gnu
      LWP_LIB_DIR: ${{ github.workspace }}/packages/lwp/lib
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:${{ github.workspace }}/packages/lwp/lib
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Prepare container for Node actions
        # 该镜像不自带 git/node：git 供 checkout 使用，node 供仍以 `uses:` 运行的 action。
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git nodejs curl
          # 容器以 root 运行，工作区可能由 runner 用户持有：git 的所有权检查会拒绝操作。
          git config --global --add safe.directory "*"
          node --version

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify in-repository dependencies
        run: |
          set -euo pipefail
          required_files=(
            packages/cangjie-gui/cjpm.toml
            packages/vips_ffi/cjpm.toml
            packages/libvlc_ffi/cjpm.toml
            packages/libavformat_ffi/cjpm.toml
            packages/libass_ffi/cjpm.toml
            packages/fontkit_ffi/native/Cargo.lock
            packages/webview/native/Cargo.lock
            packages/rocksdb_ffi/cjpm.toml
            packages/qwest/cjpm.toml
          )
          for required_file in "${required_files[@]}"; do
            if [ ! -f "${required_file}" ]; then
              echo "::error file=${required_file}::Required client-next dependency is missing from the checkout."
              exit 1
            fi
          done

      - name: Install desktop native dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config wget unzip tar xz-utils zstd ca-certificates curl git \
            xvfb mesa-vulkan-drivers weston \
            libsdl3-dev libsdl3-ttf-dev \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev \
            libvips-dev libvlc-dev librocksdb-dev \
            libavformat-dev libavcodec-dev libavutil-dev libass-dev \
            libvulkan1 libdecor-0-0 libdrm2 libgbm1 libfribidi0 \
            libasound2t64 libpulse0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxkbcommon0 libx11-6 libxcursor1 libxext6 libxfixes3 libxi6 libxrandr2 \
            libxss1 libxtst6

      - name: Verify SDL3 versions
        # 守门值与 Gitea 同一组：apt 的 sdl3 提供 libSDL3.so.0.4.2，sdl3-ttf 提供
        # libSDL3_ttf.so.0.2.2；版本漂移时在这里显式失败而不是等到链接期。
        run: |
          set -eux
          test "$(pkg-config --modversion sdl3)" = "3.4.2"
          test "$(pkg-config --modversion sdl3-ttf)" = "3.2.2"
          ls -l /usr/lib/x86_64-linux-gnu/libSDL3.so.0.4.2 \
                /usr/lib/x86_64-linux-gnu/libSDL3_ttf.so.0.2.2
          pkg-config --modversion libavformat libavcodec libavutil libass

      - name: Set up Cangjie 1.2.0
        # 按 Gitea 的 step 顺序放在依赖安装之后：setup-cangjie 解包需要 tar/xz-utils/unzip。
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.2.0
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        # CANGJIE_STDX_PATH_STATIC 指向 <CJV_HOME>/stdx/<tc>/static，其下还有 stdx 子目录
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Cache Cangjie and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cjpm/git
            ~/.cjpm/repository
            ~/.cargo/git
            ~/.cargo/registry
            packages/fontkit_ffi/native/target
            packages/webview/native/target
          key: client-next-${{ runner.os }}-cangjie-1.2.0-native-${{ hashFiles('apps/desktop/cjpm.lock', 'packages/fontkit_ffi/native/Cargo.lock', 'packages/webview/native/Cargo.lock') }}

      - name: Show compiler version
        run: cjc -v

      - name: Install Rust and build lgpu native (render backend)
        # 精简的 26.04 容器不带 Rust；lgpu 的渲染后端与 fontkit/webview 的
        # pre-build 都需要 cargo。
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "${GITHUB_PATH}"
          cd packages/lgpu/native
          cargo build --release
          test -f target/release/liblgpu_native.a

      # 真实 GPU 离屏渲染回归：文字 quad 的变换旁路语义（lavapipe 已随 apt 装好，
      # 无适配器时会静默 skip，所以直接断言测试真的跑起来）
      - name: lgpu native tests (offscreen render)
        working-directory: packages/lgpu/native
        run: cargo test --lib --test tex_transform_render -- --nocapture

      - name: Pre-generate FFI bridges
        # 三个 [ffi.c] 包在依赖解析阶段就校验静态库存在（产物被 gitignore），
        # 早于各包 build.cj 的 pre-build 钩子；fresh checkout 必须先按 build.cj 的
        # 同款命令各生成一次。rocksdb 用 C++ 头，其余两个是 C11（Gitea run 1506 的
        # 首跑正是死在这里：缺 ft2build.h 的 include 路径）。
        run: |
          set -eux
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          cc -std=c11 -Wall -Wextra -Werror -O2 -fPIC \
            -c packages/libavformat_ffi/native/lanlu_avformat_bridge.c \
            -o packages/libavformat_ffi/native/lanlu_avformat_bridge.o
          ar rcs packages/libavformat_ffi/native/liblanlu_avformat_bridge.a \
            packages/libavformat_ffi/native/lanlu_avformat_bridge.o
          # 桥里 #include <ft2build.h>，Ubuntu 把它放在 /usr/include/freetype2；
          # 路径随发行版/pkg-config 前缀变化，取 pkg-config 的 cflags 而不是硬编码。
          cc -std=c11 -Wall -Wextra -Werror -O2 -fPIC $(pkg-config --cflags freetype2) \
            -c packages/libass_ffi/native/lanlu_ass_bridge.c \
            -o packages/libass_ffi/native/lanlu_ass_bridge.o
          ar rcs packages/libass_ffi/native/liblanlu_ass_bridge.a \
            packages/libass_ffi/native/lanlu_ass_bridge.o

      - name: Build client-next
        working-directory: apps/desktop
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          cjpm build -V

      - name: Run lwp protocol tests
        run: |
          set -eux
          export LWP_LIB_DIR="$PWD/packages/lwp/lib"
          unset GIT_DIR GIT_WORK_TREE
          bash packages/lwp/native/build.sh
          (cd packages/lwp && cjpm test --no-color)

      # 引擎侧走协议的第一条路径：假壳 -> liblwp -> 漏斗 -> LWindowEvent
      - name: Run lwindow backend.lwp tests
        run: |
          set -eux
          export LWP_LIB_DIR="$PWD/packages/lwp/lib"
          export LGPU_LIB_DIR="$PWD/packages/lgpu/native/target/release"
          unset GIT_DIR GIT_WORK_TREE
          bash packages/lwp/native/build.sh
          (cd packages/lwindow && cjpm test --no-color)

      # 17 例纯逻辑测试，无需 SDL/Vulkan
      - name: Run lcodec tests
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          cd packages/lcodec
          cjpm test --no-color --timeout-each 60s

      # 编译与执行拆步：若挂起，日志会停在最后一条编译命令上，而不是整段空白。
      # --parallel 1 是 Gitea 侧的定案（串行仅 18 秒，恢复并行收益接近零）。
      - name: Compile client-next tests
        working-directory: apps/desktop
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          timeout 1800 cjpm test --no-run -V --no-color --parallel 1

      - name: Run client-next tests
        working-directory: apps/desktop
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p target/test-results
          set +e
          timeout 900 cjpm test --skip-build --parallel 1 --no-color --no-capture-output \
            --timeout-each 60s --show-all-output \
            --report-path target/test-results --report-format xml
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "::error::cjpm test 被 900s 看门狗终止（单个用例 60s 超时未生效）"
          fi
          exit "$rc"

      # M0-4 的结论做成持续回归：引擎（仓颉 dylib）调壳（C）导出符号必须在以下
      # 顺序下成功：壳 RTLD_GLOBAL 且先于引擎加载。探针同时覆盖 4 种错误顺序。
      - name: FFI call probe (engine calls shell exports)
        working-directory: tools/probes/ffi-call
        run: bash run.sh

      - name: Run headless snapshot smoke test
        working-directory: apps/desktop
        env:
          # cangjie-gui 建窗硬带 SDL_WINDOW_VULKAN flag，X11 下 SDL 需 dlopen libvulkan.so.1
          # （apt 已装 libvulkan1 loader，无 ICD 也只需 loader 符号）；窗口建成后渲染器
          # 走 software（无 GPU）。dummy 驱动无 Vulkan_LoadLibrary 实现，故用 Xvfb。
          SDL_VIDEODRIVER: x11
          SDL_RENDER_DRIVER: software
        run: |
          set -euo pipefail
          timeout 60s xvfb-run -a ./target/release/bin/main --snapshot "${PWD}/client-next.bmp"
          test -s client-next.bmp

      - name: Wayland smoke (weston headless)
        working-directory: packages/lplatform-wayland
        run: |
          set -euo pipefail
          cargo build --release
          bash tools/smoke-weston.sh --require

      - name: Package Linux deb
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          # 打包逻辑在 packages/lpack-linux（计划 §4.4）：CI 只负责调用
          bash ../../packages/lpack-linux/tools/build-deb.sh \
            --binary target/release/bin/main \
            --icon assets/lanlu_logo_gold.png \
            --out dist

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: client-next-linux-deb-${{ github.sha }}
          path: apps/desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-next-test-evidence-${{ github.sha }}
          path: |
            apps/desktop/target/test-results/
            apps/desktop/client-next.bmp
          if-no-files-found: ignore
          retention-days: 14


  windows-build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env: {}
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify in-repository dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $requiredFiles = @(
            "packages/cangjie-gui/cjpm.toml",
            "packages/vips_ffi/cjpm.toml",
            "packages/libvlc_ffi/cjpm.toml",
            "packages/libavformat_ffi/cjpm.toml",
            "packages/libass_ffi/cjpm.toml",
            "packages/fontkit_ffi/native/Cargo.lock",
            "packages/webview/native/Cargo.lock",
            "packages/rocksdb_ffi/cjpm.toml",
            "packages/qwest/cjpm.toml"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              Write-Error "Required client-next dependency is missing: $requiredFile"
            }
          }

      - name: Set up Cangjie 1.2.0
        # 与 Linux 桌面 job 同一版本：fontkit_ffi 等直接依赖声明 cjc-version = "1.2.0"。
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.2.0
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        # CANGJIE_STDX_PATH_STATIC 指向 <CJV_HOME>/stdx/<tc>/static，其下还有 stdx 子目录
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "CANGJIE_STDX_PATH=${env:CANGJIE_STDX_PATH_STATIC}\stdx"

      - name: Set up MSYS2 native dependencies
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-libvips
            mingw-w64-ucrt-x86_64-libheif
            mingw-w64-ucrt-x86_64-libjxl
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-openslide
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-vlc
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-rocksdb
            # SDL3/TTF 由 UCRT64 提供（包名已按 packages.msys2.org 核实：
            # mingw-w64-sdl3 3.4.20、mingw-w64-sdl3-ttf 3.2.2，与 Linux 侧同源）。
            # 旧工作流期望仓库内 packages/cangjie-gui/sdl/.sdl3，该目录在树里为空。
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf

      - name: Cache Cangjie and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cjpm/git
            ~/.cjpm/repository
            ~/.cargo/git
            ~/.cargo/registry
            packages/fontkit_ffi/native/target
            packages/webview/native/target
          key: client-next-${{ runner.os }}-cangjie-1.2.0-native-${{ hashFiles('apps/desktop/cjpm.lock', 'packages/fontkit_ffi/native/Cargo.lock', 'packages/webview/native/Cargo.lock') }}

      - name: Configure Windows native paths
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = "Stop"
          $mingwBin = Join-Path $env:MSYS2_LOCATION "ucrt64/bin"
          $mingwLib = Join-Path $env:MSYS2_LOCATION "ucrt64/lib"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $mingwBin
          $mingwLibraryPath = $mingwLib.Replace("\", "/")
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MINGW_LIBRARY_PATH=$mingwLibraryPath"
          # Windows 的 link-option 只用 MINGW_LIBRARY_PATH；SDL3/SDL3_ttf 由 UCRT64
          # 提供（ucrt64/lib 与 ucrt64/bin 就是上面两个变量指向的目录），不另设
          # LGUI_SDL_LIB_DIR——那是 Linux target 段专用的变量。

      - name: Show tool versions
        run: |
          cjc -v
          rustc --version
          cargo --version

      - name: Add GNU Rust target for native FFI libraries
        # build.cj 的 pre-build 在 Windows 上用 x86_64-pc-windows-gnu 构建
        # fontkit_native 和 webview_native，cjpm 的 MinGW 链接器需要 GNU 格式的 .a 产物。
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build client-next on Windows
        working-directory: apps/desktop
        run: cjpm build -V

      - name: Run rocksdb_ffi minimal FFI tests on Windows
        # §4.6 Linux/Windows 最小 FFI 测试：rocksdb_ffi 编译期版本门槛 + 全部 FFI 用例
        #（含 NUL/非法 UTF-8/0B/1B/1MiB/上限拒绝、CF、快照、cursor、事务 rollback-on-close、
        #  多线程并发读写）。bridge 由 build.cj pre-build 用 mingw g++ 编译。
        working-directory: packages/rocksdb_ffi
        run: cjpm test

      - name: Verify Windows executable
        run: |
          $executable = "apps/desktop/target/release/bin/main.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Windows executable was not produced: $executable"
          }
          Get-Item -LiteralPath $executable | Format-List Name, Length, LastWriteTime

      - name: Collect Windows runtime DLLs
        # 从 main.exe 出发用 objdump 递归解析 DLL Name，在候选目录里查找并
        # 逐个展开（传递依赖如 libarchive-13/libffi-8/SDL3_ttf 都会收录）；
        # libvips、ImageMagick 与 LibVLC 的运行时模块也作为递归根加入。不依赖
        # ldd/PATH，仓颉 runtime 目录（libcangjie-runtime.dll）直接列入候选。
        shell: msys2 {0}
        run: |
          set -euo pipefail
          stage="apps/desktop/dist/windows/lanlu-client-next"
          mkdir -p "${stage}"
          cp apps/desktop/target/release/bin/main.exe "${stage}/"

          # 仓颉 runtime 目录：setup-cangjie 导出 CANGJIE_HOME（SDK 根目录），
          # runtime 库位于 ${CANGJIE_HOME}/runtime/lib/windows_<arch>_<backend>/。
          # 注意不能用 command -v cjc 反推：msys2 下可能查不到而静默返回空。
          if [ -z "${CANGJIE_HOME:-}" ]; then
            echo "error: CANGJIE_HOME not exported by setup-cangjie" >&2
            exit 1
          fi
          runtime_dir="$(find "${CANGJIE_HOME}/runtime" -maxdepth 2 -type d -name 'windows_*' -print -quit)"
          mingw_prefix="${MINGW_LIBRARY_PATH%/lib}"
          system_dir="$(cygpath -u "${WINDIR}")/System32"
          if [ ! -d "${system_dir}" ]; then
            echo "::error::Windows system directory could not be resolved: ${system_dir}"
            exit 1
          fi

          search_dirs=(
            "$PWD/apps/desktop/target/release/bin"
            "${mingw_prefix}/bin"
            "${runtime_dir}"
          )

          # PE 的 import 表记录的名字可能与磁盘文件名不一致（SDL3 同时存在
          # libSDL3.dll / SDL3.dll 两种形态）；精确名找不到时尝试变体，命中后
          # 两种名字都落盘，保证 PE 记录的那个名字一定存在。
          variant_of() {
            case "$1" in
              lib*) printf '%s' "${1#lib}" ;;
              *) printf 'lib%s' "$1" ;;
            esac
          }

          needed() { objdump -p "$1" | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p'; }

          # libvips 解码器由 GModule 动态加载，不在 main.exe 的 PE import 表里。
          # 保留 MSYS2 的 <prefix>/lib/vips-modules-8.x 布局，并将每个模块作为
          # 递归扫描根，覆盖 HEIF/JXL/ImageMagick/OpenSlide/Poppler 后端。
          queue=("main.exe")
          modules_src="$(find "${MINGW_LIBRARY_PATH}" -maxdepth 1 -type d -name 'vips-modules-*' -print -quit)"
          if [ -z "${modules_src}" ]; then
            echo "::error::vips modules directory not found under ${MINGW_LIBRARY_PATH}."
            exit 1
          fi
          modules_rel="lib/$(basename "${modules_src}")"
          mkdir -p "${stage}/${modules_rel}"
          for mod in "${modules_src}"/*.dll; do
            cp -L "$mod" "${stage}/${modules_rel}/"
            queue+=("${modules_rel}/$(basename "$mod")")
            echo "collect (vips module): ${modules_rel}/$(basename "$mod")"
          done

          # ImageMagick 的 coder/filter 也是运行时动态模块。只收集 MagickCore DLL
          # 仍会导致常见格式在实际读取时失败，因此保留其 lib、etc、share 布局，
          # 并把所有模块 DLL 加入同一 PE 依赖闭包。
          magick_modules_src="$(find "${MINGW_LIBRARY_PATH}" -mindepth 2 -maxdepth 2 -type d -name 'modules-*' \
            -path '*/ImageMagick-*/*' -print -quit)"
          if [ -z "${magick_modules_src}" ]; then
            echo "::error::ImageMagick runtime modules were not installed."
            exit 1
          fi
          magick_lib_src="$(dirname "${magick_modules_src}")"
          magick_lib_rel="lib/$(basename "${magick_lib_src}")"
          while IFS= read -r -d '' mod_src; do
            module_rel="${mod_src#"${magick_lib_src}/"}"
            rel="${magick_lib_rel}/${module_rel}"
            mkdir -p "$(dirname "${stage}/${rel}")"
            cp -L "${mod_src}" "${stage}/${rel}"
            queue+=("${rel}")
            echo "collect (ImageMagick module): ${rel}"
          done < <(find "${magick_lib_src}" -type f -name '*.dll' -print0)
          for resource in "${mingw_prefix}/etc/ImageMagick-7" "${mingw_prefix}/share/ImageMagick-7"; do
            if [ -d "${resource}" ]; then
              resource_parent="$(basename "$(dirname "${resource}")")"
              mkdir -p "${stage}/${resource_parent}"
              cp -aL "${resource}" "${stage}/${resource_parent}/"
            fi
          done

          # ImageMagick 的 DOT coder 依赖 Graphviz。libgvc 会在运行时动态加载
          # libgvplugin_*.dll，这些模块不会出现在 dot.dll 的 PE import 表中，
          # 因此显式复制并作为递归根，避免只收集 libcgraph/libgvc 后仍无法渲染。
          graphviz_plugin_count=0
          while IFS= read -r -d '' graphviz_plugin; do
            name="$(basename "${graphviz_plugin}")"
            cp -L "${graphviz_plugin}" "${stage}/${name}"
            queue+=("${name}")
            graphviz_plugin_count=$((graphviz_plugin_count + 1))
            echo "collect (Graphviz plugin): ${name}"
          done < <(find "${mingw_prefix}/bin" -maxdepth 1 -type f -iname 'libgvplugin_*.dll' -print0)
          if [ "${graphviz_plugin_count}" -eq 0 ]; then
            echo "::error::Graphviz runtime plugins were not installed."
            exit 1
          fi

          # libvlc.dll/libvlccore.dll 只是插件宿主；访问、解封装、解码、音频输出和
          # 视频输出都由动态插件提供。Windows 便携版约定 plugins 目录与 DLL/EXE
          # 同级，因此从 MSYS2 的 lib/vlc/plugins 复制完整目录（含 plugins.dat），
          # 并把每个插件 DLL 作为递归扫描根收集其 FFmpeg 等传递依赖。
          vlc_plugins_src="${mingw_prefix}/lib/vlc/plugins"
          if [ ! -d "${vlc_plugins_src}" ]; then
            echo "::error::LibVLC plugins directory was not installed: ${vlc_plugins_src}"
            exit 1
          fi
          mkdir -p "${stage}/plugins"
          cp -aL "${vlc_plugins_src}/." "${stage}/plugins/"
          while IFS= read -r -d '' plugin; do
            rel="${plugin#"${stage}/"}"
            queue+=("${rel}")
            echo "collect (LibVLC plugin): ${rel}"
          done < <(find "${stage}/plugins" -type f -iname '*.dll' -print0)

          # Lua 播放列表解析器和服务发现脚本不参与 PE 依赖扫描，但属于 VLC 的
          # 完整运行时资源；存在时按 MSYS2 的 share/vlc 布局一并发布。
          if [ -d "${mingw_prefix}/share/vlc" ]; then
            mkdir -p "${stage}/share"
            cp -aL "${mingw_prefix}/share/vlc" "${stage}/share/"
          fi

          declare -A seen=()
          while ((${#queue[@]} > 0)); do
            current="${queue[0]}"
            queue=("${queue[@]:1}")
            while IFS= read -r dll; do
              [ -n "$dll" ] || continue
              key="$(printf '%s' "$dll" | tr '[:upper:]' '[:lower:]')"
              [ -z "${seen[$key]:-}" ] || continue
              seen[$key]=1
              found=""
              alias_src=""
              for dir in "${search_dirs[@]}"; do
                [ -n "$dir" ] || continue
                cand="$(find "$dir" -maxdepth 1 -iname "$dll" -print -quit)"
                if [ -n "$cand" ]; then
                  found="$cand"
                  break
                fi
                if [ -z "$alias_src" ]; then
                  acand="$(find "$dir" -maxdepth 1 -iname "$(variant_of "$dll")" -print -quit)"
                  if [ -n "$acand" ]; then
                    alias_src="$acand"
                  fi
                fi
              done
              if [ -z "$found" ] && [ -n "$alias_src" ]; then
                # PE 只加载它 import 表里记录的名字，按该名字落盘即可。
                cp -L "$alias_src" "${stage}/${dll}"
                found="${stage}/${dll}"
                echo "collect (alias): ${dll} <- ${alias_src}"
              fi
              if [ -n "$found" ]; then
                echo "collect: ${dll} <- ${found}"
                if [ "$found" != "${stage}/${dll}" ]; then
                  cp -L "$found" "${stage}/${dll}"
                fi
                queue+=("${dll}")
              else
                system_dll="$(find "${system_dir}" -maxdepth 1 -iname "$dll" -print -quit)"
                case "$(printf '%s' "$dll" | tr '[:upper:]' '[:lower:]')" in
                  api-ms-win-*.dll|ext-ms-win-*.dll)
                    echo "skip (Windows API set): ${dll}"
                    ;;
                  *)
                    if [ -n "${system_dll}" ]; then
                      echo "skip (Windows system): ${dll}"
                    else
                      echo "::error::Non-system runtime DLL ${dll} required by ${current} was not found."
                      exit 1
                    fi
                    ;;
                esac
              fi
            done < <(needed "${stage}/${current}")
          done

          # 关键库校验：任一缺失直接失败，避免打出跑不起来的 zip。
          # SDL3/SDL3_ttf 磁盘与 PE import 表的名字可能是带/不带 lib 前缀的任一形态，
          # 收集时已按 PE 记录名落盘（必要时经变体别名），这里按"对内任一存在"判定。
          for required in libcangjie-runtime.dll librocksdb.dll libvlc.dll libvlccore.dll; do
            if ! ls "${stage}"/"${required}" >/dev/null 2>&1; then
              echo "::error::Required runtime DLL ${required} was not collected."
              exit 1
            fi
          done
          # Reader 依赖完整的 libvips 可选后端；任一插件、直接运行库或 ImageMagick
          # coder 集缺失都中止打包，避免发布启动时才出现 GModule 警告。
          for module in vips-heif.dll vips-jxl.dll vips-magick.dll vips-openslide.dll vips-poppler.dll; do
            if ! ls "${stage}"/lib/vips-modules-*/"${module}" >/dev/null 2>&1; then
              echo "::error::Required libvips module ${module} was not collected."
              exit 1
            fi
          done
          for runtime_pattern in 'libheif*.dll' 'libjxl.dll' 'libMagickCore*.dll' 'libopenslide*.dll' \
            'libpoppler-glib*.dll' 'libcgraph*.dll' 'libgvc*.dll' 'libgvplugin_core*.dll'; do
            if ! compgen -G "${stage}/${runtime_pattern}" >/dev/null; then
              echo "::error::Required image runtime ${runtime_pattern} was not collected."
              exit 1
            fi
          done
          if ! find "${stage}"/lib/ImageMagick-*/modules-*/coders -maxdepth 1 -type f -name '*.dll' -print -quit \
            | grep -q .; then
            echo "::error::ImageMagick coder modules were not collected."
            exit 1
          fi
          # 音视频播放链路的关键插件类别必须全部存在。插件的具体文件名会随 VLC
          # 版本变化，因此按功能目录校验，而不硬编码版本相关的模块名。
          if [ ! -f "${stage}/plugins/plugins.dat" ]; then
            echo "::error::LibVLC plugin cache plugins.dat was not collected."
            exit 1
          fi
          for category in access audio_output codec demux video_output; do
            if ! find "${stage}/plugins/${category}" -maxdepth 1 -type f -iname '*.dll' -print -quit \
              | grep -q .; then
              echo "::error::LibVLC ${category} plugins were not collected."
              exit 1
            fi
          done
          for pair in "libSDL3.dll SDL3.dll" "libSDL3_ttf.dll SDL3_ttf.dll"; do
            present=0
            for name in $pair; do
              if ls "${stage}"/"${name}" >/dev/null 2>&1; then
                present=1
                break
              fi
            done
            if [ "$present" -eq 0 ]; then
              echo "::error::Required runtime DLL (${pair}) was not collected."
              exit 1
            fi
          done
          ls -l "${stage}"

      - name: Package Windows zip
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "apps/desktop/dist/windows/lanlu-client-next" `
            -DestinationPath "apps/desktop/dist/lanlu-client-next-windows-x86_64.zip" -Force

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: client-next-windows-zip-${{ github.sha }}
          path: apps/desktop/dist/lanlu-client-next-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: client-next-windows-${{ github.sha }}
          path: |
            apps/desktop/target/release/bin/main.exe
          if-no-files-found: error
          retention-days: 14

  nightly-release:
    name: Publish nightly release
    needs: [build-test, windows-build]
    # push/手动触发时发布；PR 没有写权限，只构建不发布。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: client-next-linux-deb-${{ github.sha }}
          path: release-assets

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: client-next-windows-zip-${{ github.sha }}
          path: release-assets

      - name: Publish to nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          # 该 job 只下载产物、不 checkout 源码，工作目录不是 git 仓库；
          # gh 默认靠 git remote 推断仓库，非 git 目录会报 "failed to run git"，
          # 故用 GH_REPO 显式指定目标仓库。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l release-assets
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly \
              --title "Nightly" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --notes "client-next 最新构建产物：Linux 为 .deb（amd64），Windows 为 zip。每次构建覆盖同名附件。"
          fi
          gh release upload nightly release-assets/* --clobber
          gh release edit nightly --notes "构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，commit ${GITHUB_SHA:0:12}。Linux 为 .deb（amd64），Windows 为 zip。"
