name: Client Next CI

on:
  push:
    paths:
      - "client-next/**"
      - "packages/vips_ffi/**"
      - "packages/libvlc_ffi/**"
      - "packages/fontkit_ffi/**"
      - "cangjie-repo.toml"
      - ".github/workflows/client-next.yml"
  pull_request:
    paths:
      - "client-next/**"
      - "packages/vips_ffi/**"
      - "packages/libvlc_ffi/**"
      - "packages/fontkit_ffi/**"
      - "cangjie-repo.toml"
      - ".github/workflows/client-next.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-next-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # copur/CangjieGUI 的 lanlu-client-next 分支 HEAD
  CANGJIE_GUI_COMMIT: 2f0a621ebc1dfef3471b6507f67f595361b81030

jobs:
  quality:
    name: Quality report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Cangjie 1.1.3
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.3

      - name: Show tool versions
        run: |
          set -euo pipefail
          cjc -v
          cjfmt -v
          cjlint -v

      # client-next has pre-existing formatting differences. Keep this advisory until
      # the baseline is formatted, then remove continue-on-error to make it a gate.
      - name: Check formatting (advisory)
        continue-on-error: true
        run: |
          set -euo pipefail
          format_root="${RUNNER_TEMP}/client-next-format"
          report="client-next/reports/cjfmt.diff"
          mkdir -p "${format_root}/src" client-next/reports
          cp -a client-next/src/. "${format_root}/src/"
          cp -a client-next/build.cj "${format_root}/build.cj"

          cjfmt -d "${format_root}" -c client-next/cangjie-format.toml

          format_clean=true
          diff -ru client-next/src "${format_root}/src" > "${report}" || format_clean=false
          diff -u client-next/build.cj "${format_root}/build.cj" >> "${report}" || format_clean=false
          if [ "${format_clean}" != true ]; then
            echo "::warning::client-next contains files that cjfmt would change; see the quality report artifact."
            exit 1
          fi

      - name: Run cjlint
        run: |
          set -euo pipefail
          mkdir -p client-next/reports
          cjlint -f client-next/src -r json -o client-next/reports/cjlint
          test -s client-next/reports/cjlint.json
          issue_count="$(jq 'length' client-next/reports/cjlint.json)"
          {
            echo "### client-next cjlint"
            echo
            echo "Reported issues: ${issue_count} (report-only baseline)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-next-quality-${{ github.sha }}
          path: client-next/reports/
          if-no-files-found: warn
          retention-days: 14

  build-test:
    name: Build, test and headless smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      KV4CJ_COMMIT: 1658201fda103a0e78bf4f7d1b792da37e15d026
      MMKV_COMMIT: c09632cb2f821ad725e7dc188ac1656b1ef53bb4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch pinned CangjieGUI source
        run: |
          set -euo pipefail
          git clone --branch lanlu-client-next https://gitcode.com/copur/CangjieGUI.git packages/cangjie-gui
          git -C packages/cangjie-gui checkout --detach "${CANGJIE_GUI_COMMIT}"
          actual_commit="$(git -C packages/cangjie-gui rev-parse HEAD)"
          if [ "${actual_commit}" != "${CANGJIE_GUI_COMMIT}" ]; then
            echo "::error::Unexpected CangjieGUI commit ${actual_commit}."
            exit 1
          fi

      - name: Verify in-repository dependencies
        run: |
          set -euo pipefail
          required_files=(
            packages/cangjie-gui/cjpm.toml
            packages/cangjie-gui/sdl/.sdl3/libSDL3.so.0.4.2
            packages/cangjie-gui/sdl/.sdl3/libSDL3_ttf.so.0.2.2
            packages/vips_ffi/cjpm.toml
            packages/libvlc_ffi/cjpm.toml
            packages/fontkit_ffi/native/Cargo.lock
          )
          for required_file in "${required_files[@]}"; do
            if [ ! -f "${required_file}" ]; then
              echo "::error file=${required_file}::Required client-next dependency is missing from the checkout."
              exit 1
            fi
          done

          sdl_dir="packages/cangjie-gui/sdl/.sdl3"
          ln -sfn libSDL3.so.0.4.2 "${sdl_dir}/libSDL3.so.0"
          ln -sfn libSDL3.so.0 "${sdl_dir}/libSDL3.so"
          ln -sfn libSDL3_ttf.so.0.2.2 "${sdl_dir}/libSDL3_ttf.so.0"
          ln -sfn libSDL3_ttf.so.0 "${sdl_dir}/libSDL3_ttf.so"

      - name: Set up Cangjie 1.1.3
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.3
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        # CANGJIE_STDX_PATH_STATIC 指向 <CJV_HOME>/stdx/<tc>/static，其下还有 stdx 子目录
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config unzip zlib1g-dev \
            libfontconfig1-dev libfreetype-dev libvips-dev libvlc-dev \
            libasound2t64 libdecor-0-0 libdrm2 libfribidi0 libgbm1 libharfbuzz0b libpulse0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 \
            libx11-6 libxcursor1 libxext6 libxfixes3 libxi6 libxrandr2 libxss1 libxtst6

      - name: Cache Cangjie and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cjpm/git
            ~/.cjpm/repository
            ~/.cargo/git
            ~/.cargo/registry
            packages/fontkit_ffi/native/target
          key: client-next-${{ runner.os }}-cangjie-1.1.3-cui-${{ env.CANGJIE_GUI_COMMIT }}-${{ hashFiles('client-next/cjpm.lock', 'packages/fontkit_ffi/native/Cargo.lock') }}

      - name: Fetch pinned kv4cj source
        run: |
          set -euo pipefail
          mkdir -p ref
          git clone https://gitcode.com/copur/kv4cj.git ref/kv4cj
          git -C ref/kv4cj checkout --detach "${KV4CJ_COMMIT}"
          actual_commit="$(git -C ref/kv4cj rev-parse HEAD)"
          if [ "${actual_commit}" != "${KV4CJ_COMMIT}" ]; then
            echo "::error::Unexpected kv4cj commit ${actual_commit}."
            exit 1
          fi

      - name: Build pinned MMKV native libraries
        run: |
          set -euo pipefail
          mmkv_source="${RUNNER_TEMP}/MMKV"
          mmkv_build="${RUNNER_TEMP}/MMKV-build"
          git clone --depth 1 --branch v1.2.15 https://github.com/Tencent/MMKV.git "${mmkv_source}"
          actual_commit="$(git -C "${mmkv_source}" rev-parse HEAD)"
          if [ "${actual_commit}" != "${MMKV_COMMIT}" ]; then
            echo "::error::Unexpected MMKV commit ${actual_commit}."
            exit 1
          fi

          sed -i '/add_library(core/,/STATIC/ s/STATIC/SHARED/' "${mmkv_source}/Core/CMakeLists.txt"
          # MMKV 1.2.15 relied on a transitive stdint include that newer GCC releases
          # no longer provide. Make the pinned source portable across runner compilers.
          sed -i '/#include <string>/i #include <cstdint>' "${mmkv_source}/Core/MMKVPredef.h"
          cmake -S "${mmkv_source}/Core" -B "${mmkv_build}" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${mmkv_build}" --parallel
          install -Dm755 "${mmkv_build}/libcore.so" ref/kv4cj/lib/libcore.so

          (
            cd ref/kv4cj/mmkv_cpp
            ./configure
            make -j"$(nproc)"
          )
          test -s ref/kv4cj/lib/libmymmkv.so

      - name: Configure native library path
        run: |
          set -euo pipefail
          native_paths="${GITHUB_WORKSPACE}/ref/kv4cj/lib:${GITHUB_WORKSPACE}/packages/cangjie-gui/sdl/.sdl3"
          printf 'LD_LIBRARY_PATH=%s\n' "${native_paths}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Verify native libraries
        run: |
          set -euo pipefail
          libraries=(
            ref/kv4cj/lib/libcore.so
            ref/kv4cj/lib/libmymmkv.so
            packages/cangjie-gui/sdl/.sdl3/libSDL3.so
            packages/cangjie-gui/sdl/.sdl3/libSDL3_ttf.so
          )
          for library in "${libraries[@]}"; do
            echo "Checking ${library}"
            if ldd "${library}" | tee /dev/stderr | grep -q 'not found'; then
              echo "::error file=${library}::A native runtime dependency is missing."
              exit 1
            fi
          done

      - name: Show compiler version
        run: cjc -v

      - name: Build client-next
        working-directory: client-next
        run: cjpm build -V

      - name: Run client-next tests
        working-directory: client-next
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p test-results
          cjpm test \
            --no-color \
            --parallel nCores \
            --timeout-each 60s \
            --report-path test-results \
            --report-format xml

      - name: Run headless snapshot smoke test
        working-directory: client-next
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -euo pipefail
          timeout 30s ./target/release/bin/main --snapshot "${PWD}/client-next.bmp"
          test -s client-next.bmp

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-next-test-evidence-${{ github.sha }}
          path: |
            client-next/test-results/
            client-next/client-next.bmp
          if-no-files-found: ignore
          retention-days: 14

  windows-build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      KV4CJ_COMMIT: 1658201fda103a0e78bf4f7d1b792da37e15d026
      MMKV_COMMIT: c09632cb2f821ad725e7dc188ac1656b1ef53bb4
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch pinned CangjieGUI source
        run: |
          $ErrorActionPreference = "Stop"
          git clone --branch lanlu-client-next https://gitcode.com/copur/CangjieGUI.git packages/cangjie-gui
          git -C packages/cangjie-gui checkout --detach $env:CANGJIE_GUI_COMMIT
          $actualCommit = (git -C packages/cangjie-gui rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:CANGJIE_GUI_COMMIT) {
            throw "Unexpected CangjieGUI commit $actualCommit"
          }

      - name: Verify in-repository dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $requiredFiles = @(
            "packages/cangjie-gui/cjpm.toml",
            "packages/cangjie-gui/sdl/.sdl3/libSDL3.dll",
            "packages/cangjie-gui/sdl/.sdl3/libSDL3_ttf.dll",
            "packages/vips_ffi/cjpm.toml",
            "packages/libvlc_ffi/cjpm.toml",
            "packages/fontkit_ffi/native/Cargo.lock"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              Write-Error "Required client-next dependency is missing: $requiredFile"
            }
          }

      - name: Set up Cangjie 1.1.3
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.1.3
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        # CANGJIE_STDX_PATH_STATIC 指向 <CJV_HOME>/stdx/<tc>/static，其下还有 stdx 子目录
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "CANGJIE_STDX_PATH=${env:CANGJIE_STDX_PATH_STATIC}\stdx"

      - name: Set up MSYS2 native dependencies
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-vlc
            mingw-w64-x86_64-dlfcn

      - name: Cache Cangjie and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cjpm/git
            ~/.cjpm/repository
            ~/.cargo/git
            ~/.cargo/registry
            packages/fontkit_ffi/native/target
          key: client-next-${{ runner.os }}-cangjie-1.1.3-cui-${{ env.CANGJIE_GUI_COMMIT }}-${{ hashFiles('client-next/cjpm.lock', 'packages/fontkit_ffi/native/Cargo.lock') }}

      - name: Fetch pinned kv4cj source
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path ref -Force | Out-Null
          git clone https://gitcode.com/copur/kv4cj.git ref/kv4cj
          git -C ref/kv4cj checkout --detach $env:KV4CJ_COMMIT
          $actualCommit = (git -C ref/kv4cj rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:KV4CJ_COMMIT) {
            throw "Unexpected kv4cj commit $actualCommit"
          }

      - name: Build pinned MMKV native libraries
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build-script-cache
          git clone https://github.com/Tencent/MMKV.git build-script-cache/MMKV
          git -C build-script-cache/MMKV checkout --detach "${MMKV_COMMIT}"
          actual_commit="$(git -C build-script-cache/MMKV rev-parse HEAD)"
          if [ "${actual_commit}" != "${MMKV_COMMIT}" ]; then
            echo "Unexpected MMKV commit ${actual_commit}" >&2
            exit 1
          fi

          sed -i '/add_library(core/,/STATIC/ s/STATIC/SHARED/' build-script-cache/MMKV/Core/CMakeLists.txt
          sed -i '/#include <string>/i #include <cstdint>' build-script-cache/MMKV/Core/MMKVPredef.h
          cmake \
            -S build-script-cache/MMKV/Core \
            -B build-script-cache/MMKV-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-script-cache/MMKV-build --parallel

          mkdir -p ref/kv4cj/lib
          core_dll="$(find build-script-cache/MMKV-build -type f -iname 'libcore.dll' -print -quit)"
          core_import="$(find build-script-cache/MMKV-build -type f -iname 'libcore.dll.a' -print -quit)"
          test -n "${core_dll}"
          test -n "${core_import}"
          cp "${core_dll}" "${core_import}" ref/kv4cj/lib/

          (
            cd ref/kv4cj/mmkv_cpp
            ./configure
            make -j"$(nproc)"
          )
          test -s ref/kv4cj/lib/libmymmkv.dll

      - name: Configure Windows native paths
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = "Stop"
          $mingwBin = Join-Path $env:MSYS2_LOCATION "mingw64/bin"
          $mingwLib = Join-Path $env:MSYS2_LOCATION "mingw64/lib"
          $kv4cjLib = Join-Path $env:GITHUB_WORKSPACE "ref/kv4cj/lib"
          $sdlLib = Join-Path $env:GITHUB_WORKSPACE "packages/cangjie-gui/sdl/.sdl3"
          @($mingwBin, $kv4cjLib, $sdlLib) |
            ForEach-Object { Add-Content -LiteralPath $env:GITHUB_PATH -Value $_ }
          $mingwLibraryPath = $mingwLib.Replace("\", "/")
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MINGW_LIBRARY_PATH=$mingwLibraryPath"

      - name: Show tool versions
        run: |
          cjc -v
          rustc --version
          cargo --version

      - name: Build client-next on Windows
        working-directory: client-next
        run: cjpm build -V

      - name: Verify Windows executable
        run: |
          $executable = "client-next/target/release/bin/main.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Windows executable was not produced: $executable"
          }
          Get-Item -LiteralPath $executable | Format-List Name, Length, LastWriteTime

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: client-next-windows-${{ github.sha }}
          path: |
            client-next/target/release/bin/main.exe
            client-next/target/release/bin/lanlu_logo_gold.png
          if-no-files-found: error
          retention-days: 14
