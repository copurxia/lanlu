name: Build
run-name: ${{ github.actor }} is trying to auto compile with Actions 🚀

on: [push]

jobs:
  orm-test:
    # ORM 三包（csorm / csorm_macros / postgresql-driver）cjpm test。
    # 依赖真实 PostgreSQL：service 容器 + pg_trgm/unaccent 扩展 + bench_rows 种子。
    # 独立于主 build job（无需 vips/rocksdb 等重依赖），失败快速可见。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pgtest
          POSTGRES_DB: lanlutest
          # trust 认证（本地 CI 测试库，无敏感数据）；如需密码改这里与 DB_STRING 两处
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_STRING: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable&pool.max=5
      # psql(libpq) CLI 不认驱动特有的 pool.* 查询参数（invalid URI query parameter），
      # psql 仅用于建扩展/建表/种子；去掉 pool.* 指向同一数据库即可。
      PG_DSN: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: "1.2.0"
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Install libpq headers
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpq-dev
          else
            apt-get update
            apt-get install -y --no-install-recommends libpq-dev
          fi

      - name: Prepare test database
        # 扩展 + bench_rows 种子（CTE/LATERAL/DISTINCT ON smoke 与物化基准依赖）。
        # 大结果集基准（13,335 行）在 CI 环境抖动大，种子保持同规模以复现测试断言。
        run: |
          set -eux
          PSQL="psql $PG_DSN -v ON_ERROR_STOP=1"
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS unaccent'
          $PSQL -c "CREATE TABLE IF NOT EXISTS bench_rows(id bigserial primary key, title text, filename text, summary text, tags text, extra text, n1 int, n2 bigint, f1 float8, b1 bool, t1 timestamptz, by1 bytea, j1 jsonb)"
          $PSQL -c "INSERT INTO bench_rows(title, filename, summary, tags, extra, n1, n2, f1, b1, t1, by1, j1) SELECT '漫画标题编号'||i, 'file_'||i||'.zip', 'summary text '||i, 'tag_a,tag_b,tag_'||(i%50), 'x', i%100, i*7, i*0.5, i%2=0, now() - (i||' hours')::interval, ('\\x'||md5(i::text))::bytea, jsonb_build_object('k', i) FROM generate_series(1,13335) s(i) ON CONFLICT DO NOTHING"

      - name: Pre-generate C bridge static lib
        # postgresql-driver 的 [ffi.c] 在 cjpm update 阶段校验 liblanlu_pg_bridge.a 存在
        # （产物被 gitignore，fresh checkout 不存在）；与 rocksdb bridge 同款预生成。
        run: |
          set -eux
          cc -O2 -fPIC -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o

      - name: Run csorm tests
        run: |
          set -eux
          cd packages/csorm
          cjpm test

      - name: Run postgresql-driver tests
        run: |
          set -eux
          cd packages/postgresql-driver
          cjpm test

  build:
    # The runtime image is Ubuntu 26.04; build the binary on the same distro so
    # dynamically linked sonames (notably librocksdb) match at runtime.
    runs-on: ubuntu-26.04
    env:
      # xmake refuses to run as root unless explicitly allowed. Some CI runners execute as root.
      XMAKE_ROOT: "y"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: "1.2.0"
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        # CANGJIE_STDX_PATH_STATIC 指向 <CJV_HOME>/stdx/<tc>/static，其下还有 stdx 子目录
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Install build tools
        run: |
          set -eux

          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev libsqlite3-dev libmysqlclient-dev
          else
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev libsqlite3-dev libmysqlclient-dev
          fi

      - name: Verify xmake
        run: |
          set -eux
          xmake --version

      - name: Checkout WasmEdge source (public)
        # 不用 actions/checkout：runner 拉到的兼容版 checkout（上游 < v4.1.0）
        # 不支持 github-server-url 输入，remote 仍会落到本实例并报
        # "user redirect does not exist [name: wasmedge]"（run 985/993）。
        # 公开仓库直接 clone 即可；不带 --depth 等价原 fetch-depth: 0（全历史+tags）。
        run: |
          set -eux
          mkdir -p build-script-cache
          git clone https://github.com/WasmEdge/WasmEdge build-script-cache/WasmEdge

      - name: Build backend
        env:
          WASMEDGE_REPO_DIR: ${{ github.workspace }}/build-script-cache/WasmEdge
        run: |
          unset GIT_DIR GIT_WORK_TREE
          # rocksdb_ffi 的 [ffi.c] 校验发生在 cjpm update 阶段，早于 build.cj 的
          # pre-build 钩子；fresh checkout 下 liblanlu_rocksdb_bridge.a 被 gitignore
          # 不存在，update 直接报 "can not find the library"。这里按 build.cj 的
          # 同款命令预生成（build 阶段 pre-build 会幂等重编，无冲突）。
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          # postgresql-driver 的 lanlu_pg_bridge 同理（C bridge，用 cc 而非 g++，
          # 需要 libpq 头文件）。缺它时 cjpm update 报 "can not find the library
          # 'lanlu_pg_bridge'"。
          cc -O2 -fPIC \
            -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o
          cjpm update
          for f in $(find "$HOME/.cjpm/git/wasmedge_ffi" -type f -name build_native.sh 2>/dev/null); do
            grep -q "^unset GIT_DIR GIT_WORK_TREE$" "$f" || sed -i "2iunset GIT_DIR GIT_WORK_TREE" "$f"
          done
          cjc -v
          cjpm build -V

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Setup pnpm (corepack)
        run: |
          set -eux
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm -v

      - name: Build frontend
        run: |
          cd frontend
          pnpm install
          pnpm run build

      - name: Prepare release artifacts
        run: |
          mkdir -p app
          mkdir -p app/frontend
          cp target/release/bin/main app/
          cp -r frontend/out app/frontend/out

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/main
            app/frontend

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: ./app/

      - name: Set execute permissions
        run: chmod +x ./app/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image_tag
        run: |
          set -eu
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            tag="dev-$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g')"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: lanlu:smoke
          cache-from: type=gha,scope=lanlu
          cache-to: type=gha,mode=max,scope=lanlu

      - name: Smoke test image
        run: bash ./scripts/docker-smoke-test.sh lanlu:smoke

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ steps.image_tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.image_tag.outputs.tag }}
          cache-from: type=gha,scope=lanlu

  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools curl
          # runner 镜像不带 Rust 工具链，rustup/cargo 均需自装（run 983/986 教训）
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-musl

      - name: Build lanlu-mcp (static musl)
        run: |
          # PATH 不跨 step 持久，cargo 前必须再 source 一次
          . "$HOME/.cargo/env"
          cd mcp
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --target x86_64-unknown-linux-musl

      - name: Package lanlu-mcp zip
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist/lanlu-mcp
          cp mcp/target/x86_64-unknown-linux-musl/release/lanlu-mcp dist/lanlu-mcp/
          cp mcp/README.md dist/lanlu-mcp/
          chmod +x dist/lanlu-mcp/lanlu-mcp
          cd dist
          zip -qr "lanlu-mcp-${GITHUB_SHA::7}.zip" lanlu-mcp
          ls -lah .

      - name: Upload lanlu-mcp artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlu-mcp
          path: dist/lanlu-mcp-*.zip
