name: Build
run-name: ${{ github.actor }} is trying to auto compile with Actions 🚀

on: [push]

jobs:
  orm-test:
    # ORM 三包（csorm / csorm_macros / postgresql-driver）cjpm test。
    # 依赖真实 PostgreSQL：service 容器 + pg_trgm/unaccent 扩展 + bench_rows 种子。
    # 独立于主 build job（无需 vips/rocksdb 等重依赖），失败快速可见。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pgtest
          POSTGRES_DB: lanlutest
          # trust 认证（本地 CI 测试库，无敏感数据）；如需密码改这里与 DB_STRING 两处
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_STRING: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable&pool.max=5
      # psql(libpq) CLI 不认驱动特有的 pool.* 查询参数（invalid URI query parameter），
      # psql 仅用于建扩展/建表/种子；去掉 pool.* 指向同一数据库即可。
      PG_DSN: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: "1.2.0"
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Install libpq headers
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client
          else
            apt-get update
            apt-get install -y --no-install-recommends libpq-dev postgresql-client
          fi

      - name: Prepare test database
        # 扩展 + bench_rows 种子（CTE/LATERAL/DISTINCT ON smoke 与物化基准依赖）。
        # 大结果集基准（13,335 行）在 CI 环境抖动大，种子保持同规模以复现测试断言。
        run: |
          set -eux
          PSQL="psql $PG_DSN -v ON_ERROR_STOP=1"
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS unaccent'
          $PSQL -c "CREATE TABLE IF NOT EXISTS bench_rows(id bigserial primary key, title text, filename text, summary text, tags text, extra text, n1 int, n2 bigint, f1 float8, b1 bool, t1 timestamptz, by1 bytea, j1 jsonb)"
          $PSQL -c "INSERT INTO bench_rows(title, filename, summary, tags, extra, n1, n2, f1, b1, t1, by1, j1) SELECT '漫画标题编号'||i, 'file_'||i||'.zip', 'summary text '||i, 'tag_a,tag_b,tag_'||(i%50), 'x', i%100, i*7, i*0.5, i%2=0, now() - (i||' hours')::interval, ('\\x'||md5(i::text))::bytea, jsonb_build_object('k', i) FROM generate_series(1,13335) s(i) ON CONFLICT DO NOTHING"

      - name: Pre-generate C bridge static lib
        # postgresql-driver 的 [ffi.c] 在 cjpm update 阶段校验 liblanlu_pg_bridge.a 存在
        # （产物被 gitignore，fresh checkout 不存在）；与 rocksdb bridge 同款预生成。
        run: |
          set -eux
          cc -O2 -fPIC -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o

      - name: Run csorm tests
        run: |
          set -eux
          cd packages/csorm
          cjpm test

      - name: Run postgresql-driver tests
        run: |
          set -eux
          cd packages/postgresql-driver
          cjpm test

  server-test:
    # 根包 12 个用例。数据库用例连不上库时会静默打印 [skip] 并返回成功，
    # 因此本 job 同时提供 PostgreSQL 服务并在测试后把 [skip] 视为失败。
    # 与 Gitea 的 server-test 同为 ubuntu-latest：这个 job 不做运行时 ABI 匹配
    #（那是 build/package 的事），用固定标签反而多一个会漂移的变量。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pgtest
          POSTGRES_DB: lanlutest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_STRING: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable&pool.max=5
      # psql(libpq) CLI 不认驱动特有的 pool.* 查询参数，建扩展时用无 pool 的 DSN。
      PG_DSN: postgres://pgtest@127.0.0.1:5432/lanlutest?sslmode=disable
      XMAKE_ROOT: "y"
      WASMEDGE_REPO_DIR: ${{ github.workspace }}/build-script-cache/WasmEdge
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: "1.2.0"
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Install build tools
        run: |
          set -eux
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev postgresql-client libsqlite3-dev libmysqlclient-dev
          else
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl git wget unzip zip xz-utils \
              build-essential clang ninja-build cmake binutils \
              xmake \
              pkg-config \
              libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
              libvips-dev libheif-dev librocksdb-dev \
              libpq-dev postgresql-client libsqlite3-dev libmysqlclient-dev
          fi

      - name: Prepare test database extensions
        # 根测试并行跑迁移时 X013UACC 可能因 V013 尚未落库而跳过；unaccent 缺失会让
        # 搜索文档用例直接报 "function unaccent(text) does not exist"。与 orm-test 一致，
        # 先把扩展建好，迁移只负责索引与包装函数。缺扩展时用例打印 [skip]，
        # 而本 job 末尾把 [skip] 视为失败——这正是 run 44873527458 step 10 的失败原因。
        run: |
          set -eux
          PSQL="psql $PG_DSN -v ON_ERROR_STOP=1"
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
          $PSQL -c 'CREATE EXTENSION IF NOT EXISTS unaccent'

      - name: Checkout WasmEdge source (public)
        run: |
          set -eux
          mkdir -p build-script-cache
          # 上行网络抖动时 clone 会静默挂住；加 300s 看门狗 + 单次重试（Gitea 已采用）。
          clone_wasmedge() {
            timeout 300 git clone https://github.com/WasmEdge/WasmEdge build-script-cache/WasmEdge
          }
          if ! clone_wasmedge; then
            echo "::warning::WasmEdge clone 首次失败或超时，清理残留后重试一次"
            rm -rf build-script-cache/WasmEdge
            clone_wasmedge
          fi

      - name: Pre-generate C bridge static libs
        run: |
          set -eux
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          cc -O2 -fPIC \
            -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o

      - name: Resolve dependencies and guard lock
        run: |
          set -eux
          unset GIT_DIR GIT_WORK_TREE
          # PR6：服务端 manifest 已迁到 apps/server；target/ 与 build-script-cache/
          # 跟随 CWD，git 的 pathspec 也相对 CWD，故 cjpm.lock 即 apps/server/cjpm.lock。
          cd apps/server
          cjpm update
          if ! git diff --exit-code -- cjpm.lock; then
            git diff -- cjpm.lock || true
            echo "::error::cjpm.lock changed during dependency resolution; migrate and commit the lock before testing"
            exit 1
          fi
          for f in $(find "$HOME/.cjpm/git/wasmedge_ffi" -type f -name build_native.sh 2>/dev/null); do
            grep -q "^unset GIT_DIR GIT_WORK_TREE$" "$f" || sed -i "2iunset GIT_DIR GIT_WORK_TREE" "$f"
            # 新 GCC 把 vendored wasm.hh 的 strncpy 判为 -Wstringop-truncation，而
            # WasmEdge 会把 -Werror 追加在 CMAKE_CXX_FLAGS 之后；只有 warning 级
            # 的 -Wno-error=... 能存活（Gitea 实测）。
            grep -q -- "-Wno-error=stringop-truncation" "$f" || sed -i "s/-Wno-array-bounds/-Wno-array-bounds -Wno-error=stringop-truncation/" "$f"
          done

      - name: Run root package tests
        run: |
          set -euo pipefail
          cd apps/server
          mkdir -p target/test-results
          cjpm test \
            --no-color \
            --timeout-each 60s \
            --show-all-output \
            --report-path "$PWD/target/test-results/server" \
            --report-format xml \
            2>&1 | tee target/test-results/server-test.log
          if grep -Fq '[skip]' target/test-results/server-test.log; then
            echo "::error::Database tests printed [skip]; PostgreSQL prerequisites are not ready"
            exit 1
          fi

      - name: Upload root test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: apps/server/target/test-results/
          if-no-files-found: warn

  build:
    # 与 Gitea `build` job 同一份配方：在**运行镜像的同一快照**里链接。
    # 旧版跑在裸 ubuntu-26.04 runner 上，链接到的 librocksdb 是 runner 自己的版本，
    # 与 26.04 运行镜像里的 9.11 不一致；且裸 runner 缺 WasmEdge 构建所需的补丁，
    # 导致 run 44873527458 step 8 `Build backend` 连红 7 次。
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
    env:
      # xmake refuses to run as root unless explicitly allowed. Some CI runners execute as root.
      XMAKE_ROOT: "y"
    steps:
      - name: Prepare container for Node actions
        # 该镜像不自带 git/node：git 供 checkout 使用，node 供仍以 `uses:` 运行的 action。
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git nodejs curl
          # 容器以 root 运行，工作区可能由 runner 用户持有：git 的所有权检查会拒绝操作。
          git config --global --add safe.directory "*"
          node --version
          git --version

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install build tools
        # 容器内已是 root，无需 sudo。GitHub runner 的内核支持 openat2，故不搬
        # Gitea/CNB 的 `tar=1.35+dfsg-4` 降级 pin（那是 5.4 内核宿主专用 workaround）。
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git wget unzip zip xz-utils \
            build-essential clang ninja-build cmake binutils \
            xmake \
            pkg-config \
            libarchive-dev libavif-dev libbrotli-dev libargon2-dev \
            libvips-dev libheif-dev librocksdb-dev \
            libpq-dev postgresql-client libsqlite3-dev libmysqlclient-dev

      - name: Setup Cangjie
        # 放在依赖安装之后：setup-cangjie 解包需要 tar/xz-utils，与 Gitea 的 step 顺序一致。
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: "1.2.0"
          components: stdx

      - name: Export CANGJIE_STDX_PATH
        # CANGJIE_STDX_PATH_STATIC 指向 <CJV_HOME>/stdx/<tc>/static，其下还有 stdx 子目录
        run: echo "CANGJIE_STDX_PATH=${CANGJIE_STDX_PATH_STATIC}/stdx" >> "${GITHUB_ENV}"

      - name: Verify xmake
        run: |
          set -eux
          xmake --version

      - name: Checkout WasmEdge source (public)
        # 不用 actions/checkout：runner 拉到的兼容版 checkout（上游 < v4.1.0）
        # 不支持 github-server-url 输入，remote 仍会落到本实例并报
        # "user redirect does not exist [name: wasmedge]"（run 985/993）。
        # 公开仓库直接 clone 即可；不带 --depth 等价原 fetch-depth: 0（全历史+tags）。
        run: |
          set -eux
          mkdir -p build-script-cache
          # 上行网络抖动时 clone 会静默挂住；加 300s 看门狗 + 单次重试（Gitea 已采用）。
          clone_wasmedge() {
            timeout 300 git clone https://github.com/WasmEdge/WasmEdge build-script-cache/WasmEdge
          }
          if ! clone_wasmedge; then
            echo "::warning::WasmEdge clone 首次失败或超时，清理残留后重试一次"
            rm -rf build-script-cache/WasmEdge
            clone_wasmedge
          fi

      - name: Build backend
        env:
          WASMEDGE_REPO_DIR: ${{ github.workspace }}/build-script-cache/WasmEdge
        run: |
          unset GIT_DIR GIT_WORK_TREE
          # rocksdb_ffi 的 [ffi.c] 校验发生在 cjpm update 阶段，早于 build.cj 的
          # pre-build 钩子；fresh checkout 下 liblanlu_rocksdb_bridge.a 被 gitignore
          # 不存在，update 直接报 "can not find the library"。这里按 build.cj 的
          # 同款命令预生成（build 阶段 pre-build 会幂等重编，无冲突）。
          g++ -std=c++17 -O2 -fPIC \
            -c packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.c \
            -o packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          ar rcs packages/rocksdb_ffi/native/liblanlu_rocksdb_bridge.a \
            packages/rocksdb_ffi/native/lanlu_rocksdb_bridge.o
          # postgresql-driver 的 lanlu_pg_bridge 同理（C bridge，用 cc 而非 g++，
          # 需要 libpq 头文件）。缺它时 cjpm update 报 "can not find the library
          # 'lanlu_pg_bridge'"。
          cc -O2 -fPIC \
            -c packages/postgresql-driver/native/lanlu_pg_bridge.c \
            -o packages/postgresql-driver/native/lanlu_pg_bridge.o \
            -I/usr/include/postgresql
          ar rcs packages/postgresql-driver/native/liblanlu_pg_bridge.a \
            packages/postgresql-driver/native/lanlu_pg_bridge.o
          # PR6：C 桥仍从仓库根预生成，cjpm 进 apps/server 后 target/ 落在包内。
          cd apps/server
          cjpm update
          if ! git diff --exit-code -- cjpm.lock; then
            git diff -- cjpm.lock || true
            echo "::error::cjpm.lock changed during dependency resolution; migrate and commit the lock before building"
            exit 1
          fi
          for f in $(find "$HOME/.cjpm/git/wasmedge_ffi" -type f -name build_native.sh 2>/dev/null); do
            grep -q "^unset GIT_DIR GIT_WORK_TREE$" "$f" || sed -i "2iunset GIT_DIR GIT_WORK_TREE" "$f"
            # 新 GCC 把 vendored wasm.hh 的 strncpy 判为 -Wstringop-truncation，而
            # WasmEdge 会把 -Werror 追加在 CMAKE_CXX_FLAGS 之后；只有 warning 级
            # 的 -Wno-error=... 能存活（Gitea 实测，run 44873527458 step 8 缺它）。
            grep -q -- "-Wno-error=stringop-truncation" "$f" || sed -i "s/-Wno-array-bounds/-Wno-array-bounds -Wno-error=stringop-truncation/" "$f"
          done
          cjc -v
          cjpm build -V

      - name: Run lcodec tests
        # lcodec 单测 17 例。图片后端运行时 dlopen libvips，build job 已安装。
        # Gitea 的 build job 一直有这一步；GitHub 侧缺失，等于 17 例从未在 GitHub 跑过。
        run: |
          set -eux
          # envsetup.sh 第 48 行直接展开 $LD_LIBRARY_PATH，set -u 下会 unbound variable。
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          unset GIT_DIR GIT_WORK_TREE
          cd packages/lcodec
          cjpm test --no-color --timeout-each 60s

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Setup pnpm (corepack)
        run: |
          set -eux
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm -v

      - name: Install frontend dependencies
        run: |
          cd apps/web
          pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: |
          cd apps/web
          pnpm run typecheck

      - name: Test frontend
        run: |
          cd apps/web
          pnpm run test:ci

      - name: Build frontend
        run: |
          cd apps/web
          pnpm run build

      - name: Prepare release artifacts
        run: |
          mkdir -p app
          mkdir -p app/frontend
          cp apps/server/target/release/bin/main app/
          cp -r apps/web/out app/frontend/out

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/main
            app/frontend

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: ./app/

      - name: Set execute permissions
        run: chmod +x ./app/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image_tag
        run: |
          set -eu
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            tag="dev-$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g')"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: lanlu:smoke
          cache-from: type=gha,scope=lanlu
          cache-to: type=gha,mode=max,scope=lanlu

      - name: Smoke test image
        run: bash ./scripts/docker-smoke-test.sh lanlu:smoke

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ steps.image_tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.image_tag.outputs.tag }}
          cache-from: type=gha,scope=lanlu

  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools curl
          # runner 镜像不带 Rust 工具链，rustup/cargo 均需自装（run 983/986 教训）
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-musl

      - name: Build lanlu-mcp (static musl)
        run: |
          # PATH 不跨 step 持久，cargo 前必须再 source 一次
          . "$HOME/.cargo/env"
          cd apps/mcp
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --release --target x86_64-unknown-linux-musl

      - name: Package lanlu-mcp zip
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist/lanlu-mcp
          cp apps/mcp/target/x86_64-unknown-linux-musl/release/lanlu-mcp dist/lanlu-mcp/
          cp apps/mcp/README.md dist/lanlu-mcp/
          chmod +x dist/lanlu-mcp/lanlu-mcp
          cd dist
          zip -qr "lanlu-mcp-${GITHUB_SHA::7}.zip" lanlu-mcp
          ls -lah .

      - name: Upload lanlu-mcp artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanlu-mcp
          path: dist/lanlu-mcp-*.zip
